<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3-Upload Single A4 Page PDF Generator</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #cbd5e1;
      color: #0f172a;
    }

    /* Control Toolbar (Hidden when printing/saving PDF) */
    .toolbar {
      width: 210mm;
      margin: 0 auto 14px;
      background: #0f172a;
      color: #f8fafc;
      padding: 14px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.2);
    }

    .toolbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
    }

    .toolbar-top h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: #ffffff;
    }

    .btn-clear {
      background: #475569;
    }
    .btn-clear:hover {
      background: #334155;
    }

    .btn-pdf {
      background: #16a34a;
    }
    .btn-pdf:hover {
      background: #15803d;
    }

    .upload-controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .upload-box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .upload-box label {
      font-size: 12px;
      font-weight: 600;
      color: #93c5fd;
    }

    .upload-box input[type="text"] {
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #ffffff;
      font-size: 12px;
    }

    .upload-box input[type="file"] {
      font-size: 11px;
      color: #cbd5e1;
    }

    /* Exact Single A4 Page Container (210mm x 297mm) */
    .a4-sheet {
      width: 210mm;
      height: 297mm;
      margin: 0 auto;
      background: #ffffff;
      padding: 10mm;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.25);
      border: 1.5px solid #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .sheet-header {
      text-align: center;
      border-bottom: 2px solid #000000;
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .sheet-header input {
      width: 100%;
      border: none;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      color: #000000;
      outline: none;
      background: transparent;
    }

    /* 3-Slot Vertical Layout (Fits 3 uploads cleanly inside 1 A4 page) */
    .slots-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8mm;
      justify-content: space-between;
      overflow: hidden;
    }

    .photo-card {
      flex: 1;
      border: 1.5px solid #000000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .photo-caption {
      background: #e2e8f0;
      border-bottom: 1.5px solid #000000;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 700;
      color: #000000;
      text-align: center;
    }

    .photo-frame {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
      background: #f8fafc;
    }

    .photo-frame img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: none;
    }

    .placeholder-text {
      color: #64748b;
      font-size: 12px;
      font-style: italic;
    }

    /* Strict Single-Page A4 Print Rules */
    @media print {
      @page {
        size: A4 portrait;
        margin: 0;
      }

      html, body {
        width: 210mm;
        height: 297mm;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        overflow: hidden !important;
      }

      .toolbar {
        display: none !important;
      }

      .a4-sheet {
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
        padding: 10mm !important;
        box-shadow: none !important;
        border: 1.5px solid #000000 !important;
        page-break-inside: avoid !important;
        page-break-after: avoid !important;
      }

      .photo-frame {
        background: #ffffff !important;
      }
    }
  </style>
</head>
<body>

  <!-- Upload & Action Toolbar -->
  <div class="toolbar">
    <div class="toolbar-top">
      <h2>3-Document Single A4 PDF Generator</h2>
      <div class="btn-group">
        <button type="button" class="btn-clear" onclick="clearAll()">Clear</button>
        <button type="button" class="btn-pdf" onclick="window.print()">Save / Print A4 PDF</button>
      </div>
    </div>

    <div class="upload-controls">
      <div class="upload-box">
        <label for="file1">Upload 1</label>
        <input type="text" id="title1" value="1. Photo of Installed Plant" oninput="updateTitle(1)" placeholder="Enter label..." />
        <input type="file" id="file1" accept="image/*" onchange="previewUpload(1)" />
      </div>

      <div class="upload-box">
        <label for="file2">Upload 2</label>
        <input type="text" id="title2" value="2. Electricity Bill / Site Photo" oninput="updateTitle(2)" placeholder="Enter label..." />
        <input type="file" id="file2" accept="image/*" onchange="previewUpload(2)" />
      </div>

      <div class="upload-box">
        <label for="file3">Upload 3</label>
        <input type="text" id="title3" value="3. Customer / Meter Photo" oninput="updateTitle(3)" placeholder="Enter label..." />
        <input type="file" id="file3" accept="image/*" onchange="previewUpload(3)" />
      </div>
    </div>
  </div>

  <!-- Single A4 Page Preview & Print Area -->
  <div class="a4-sheet">
    <div class="sheet-header">
      <input type="text" id="docHeader" value="SITE & DOCUMENT PHOTOGRAPHS" />
    </div>

    <div class="slots-container">
      <!-- Slot 1 -->
      <div class="photo-card">
        <div class="photo-caption" id="cap1">1. Photo of Installed Plant</div>
        <div class="photo-frame">
          <span class="placeholder-text" id="ph1">No file selected for Upload 1</span>
          <img id="img1" alt="Upload 1" />
        </div>
      </div>

      <!-- Slot 2 -->
      <div class="photo-card">
        <div class="photo-caption" id="cap2">2. Electricity Bill / Site Photo</div>
        <div class="photo-frame">
          <span class="placeholder-text" id="ph2">No file selected for Upload 2</span>
          <img id="img2" alt="Upload 2" />
        </div>
      </div>

      <!-- Slot 3 -->
      <div class="photo-card">
        <div class="photo-caption" id="cap3">3. Customer / Meter Photo</div>
        <div class="photo-frame">
          <span class="placeholder-text" id="ph3">No file selected for Upload 3</span>
          <img id="img3" alt="Upload 3" />
        </div>
      </div>
    </div>
  </div>

  <script>
    function previewUpload(slot) {
      const fileInput = document.getElementById(`file${slot}`);
      const imgEl = document.getElementById(`img${slot}`);
      const phEl = document.getElementById(`ph${slot}`);
      const file = fileInput.files[0];

      if (!file) {
        imgEl.style.display = 'none';
        imgEl.src = '';
        phEl.style.display = 'block';
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        imgEl.src = e.target.result;
        imgEl.style.display = 'block';
        phEl.style.display = 'none';
      };
      reader.readAsDataURL(file);
    }

    function updateTitle(slot) {
      const val = document.getElementById(`title${slot}`).value;
      document.getElementById(`cap${slot}`).textContent = val || `Upload ${slot}`;
    }

    function clearAll() {
      for (let i = 1; i <= 3; i++) {
        document.getElementById(`file${i}`).value = '';
        const imgEl = document.getElementById(`img${i}`);
        imgEl.src = '';
        imgEl.style.display = 'none';
        document.getElementById(`ph${i}`).style.display = 'block';
      }
    }
  </script>

  <script>
    // Disable right-click context menu
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // Disable DevTools, View Source, and Save Page keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(key)) ||
        (e.ctrlKey && ['U', 'S'].includes(key)) ||
        (e.metaKey && e.altKey && ['I', 'J', 'C'].includes(key)) ||
        (e.metaKey && ['U', 'S'].includes(key))
      ) {
        e.preventDefault();
      }
    });
  </script>

</body>
</html>
