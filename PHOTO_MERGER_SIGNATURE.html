<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MANIKARNIKA // Photo & Signature Merger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eef3f8;
    margin: 0;
    padding: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 480px;
    margin: auto;
    padding: 22px;
    background: white;
    border-radius: 16px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
}

h1 {
    font-size: 20px;
    color: #16845b;
    text-align: center;
    margin-top: 0;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    font-size: 13px;
    color: #64748b;
    margin-bottom: 20px;
}

.upload-group {
    margin-bottom: 15px;
    background: #f8fafc;
    border: 1px dashed #cbd5e1;
    padding: 12px;
    border-radius: 10px;
    text-align: left;
}

.upload-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #334155;
    margin-bottom: 6px;
}

input[type="file"] {
    width: 100%;
    font-size: 14px;
    color: #475569;
}

.preview-box {
    text-align: center;
    margin: 20px 0;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 15px;
    min-height: 150px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

canvas {
    max-width: 100%;
    height: auto;
    border: 1px solid #94a3b8;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.placeholder-text {
    color: #94a3b8;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #16a36b, #087443);
    color: white;
    box-shadow: 0 4px 12px rgba(22, 163, 107, 0.3);
    transition: transform 0.1s, opacity 0.2s;
}

button:active {
    transform: scale(0.98);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
}

#status {
    font-size: 13px;
    text-align: center;
    margin-top: 12px;
    font-weight: 500;
    color: #16845b;
}
</style>
</head>

<body>

<div class="container">

    <h1>MANIKARNIKA MERGER</h1>
    <div class="subtitle">Combine Passport Photo & Signature for Job Portals</div>

    <!-- PHOTO INPUT -->
    <div class="upload-group">
        <label for="photoInput">1. Select Passport Photo (.jpg / .png)</label>
        <input type="file" id="photoInput" accept="image/*" onchange="handleImageInput()">
    </div>

    <!-- SIGNATURE INPUT -->
    <div class="upload-group">
        <label for="sigInput">2. Select Signature Image (.jpg / .png)</label>
        <input type="file" id="sigInput" accept="image/*" onchange="handleImageInput()">
    </div>

    <!-- PREVIEW AREA -->
    <div class="preview-box">
        <div id="placeholderText" class="placeholder-text">Merged preview will appear here</div>
        <canvas id="mergeCanvas" style="display: none;"></canvas>
    </div>

    <!-- DOWNLOAD BUTTON -->
    <button id="downloadBtn" onclick="downloadImage()" disabled>
        DOWNLOAD COMBINED IMAGE
    </button>

    <div id="status">Upload both images to generate.</div>

</div>

<script>
    let photoImg = null;
    let sigImg = null;

    function handleImageInput() {
        const photoFile = document.getElementById("photoInput").files[0];
        const sigFile = document.getElementById("sigInput").files[0];
        const statusEl = document.getElementById("status");

        let loadedCount = 0;
        let totalToLoad = 0;

        if (photoFile) totalToLoad++;
        if (sigFile) totalToLoad++;

        if (totalToLoad === 0) {
            statusEl.textContent = "Please select both images.";
            return;
        }

        statusEl.textContent = "Processing images...";

        if (photoFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                photoImg = new Image();
                photoImg.onload = function() {
                    checkAndRender();
                };
                photoImg.src = e.target.result;
            };
            reader.readAsDataURL(photoFile);
        } else {
            photoImg = null;
        }

        if (sigFile) {
            const reader = new FileReader();
            reader.onload = function(e) {
                sigImg = new Image();
                sigImg.onload = function() {
                    checkAndRender();
                };
                sigImg.src = e.target.result;
            };
            reader.readAsDataURL(sigFile);
        } else {
            sigImg = null;
        }
    }

    function checkAndRender() {
        // Only render if both images are uploaded
        if (photoImg && sigImg) {
            renderMergedImage();
        }
    }

    function renderMergedImage() {
        const canvas = document.getElementById("mergeCanvas");
        const ctx = canvas.getContext("2d");
        const placeholder = document.getElementById("placeholderText");
        const downloadBtn = document.getElementById("downloadBtn");
        const statusEl = document.getElementById("status");

        // Standardized layout dimensions for job portal uploads (Photo on top, Signature below)
        const targetWidth = 600;
        
        // Calculate proportional heights
        const photoHeight = (photoImg.height * targetWidth) / photoImg.width;
        const sigHeight = (sigImg.height * targetWidth) / sigImg.width;

        canvas.width = targetWidth;
        canvas.height = photoHeight + sigHeight + 20; // 20px padding between them

        // Fill background white
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw Photo on top
        ctx.drawImage(photoImg, 0, 0, targetWidth, photoHeight);

        // Draw Signature below photo
        ctx.drawImage(sigImg, 0, photoHeight + 20, targetWidth, sigHeight);

        // UI Updates
        placeholder.style.display = "none";
        canvas.style.display = "block";
        downloadBtn.disabled = false;
        statusEl.textContent = "Ready to download!";
    }

    function downloadImage() {
        send_10();
        const canvas = document.getElementById("mergeCanvas");
        const link = document.createElement("a");
        link.download = "manikarnika_photo_signature.jpg";
        link.href = canvas.toDataURL("image/jpeg", 0.9);
        link.click();
    }
</script>

<script>
    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey &&
            ["I", "J", "C"].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && e.key.toUpperCase() === "U")
        ) {
            e.preventDefault();
        }
    });
    </script>
<script src="database_script.js"></script>

</body>
</html>
