
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANIKARNIKA - Multiple Image Cropper</title>

<!-- ZIP Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#10172b,#202c48);
    color: white;
}

.container {
    max-width: 950px;
    margin: auto;
    background: #ffffff;
    color: #222;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 10px 35px #0005;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    color: #e87916;
    margin-bottom: 5px;
}

header p {
    color: #666;
}

.upload {
    border: 2px dashed #e87916;
    border-radius: 14px;
    padding: 35px 15px;
    text-align: center;
    cursor: pointer;
    background: #fff8ef;
    margin-bottom: 20px;
}

.upload:hover {
    background: #ffefd9;
}

.upload h3 {
    color: #d66b0a;
}

.controls {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.controls label {
    font-weight: bold;
    display: block;
    margin-bottom: 7px;
}

select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

button {
    border: none;
    border-radius: 8px;
    padding: 13px 20px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.download {
    background: #159447;
    color: white;
    flex: 1;
}

.reset {
    background: #e74c3c;
    color: white;
}

button:disabled {
    background: #aaa;
    cursor: not-allowed;
}

#status {
    background: #edf4ff;
    color: #174c88;
    padding: 12px;
    border-radius: 8px;
    margin: 15px 0;
    text-align: center;
    font-weight: bold;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(145px,1fr));
    gap: 15px;
    margin-top: 20px;
}

.item {
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    overflow: hidden;
}

.item img {
    width: 100%;
    height: 145px;
    object-fit: contain;
    background: #eee;
    border-radius: 7px;
}

.item p {
    font-size: 12px;
    word-break: break-word;
}

footer {
    text-align: center;
    margin-top: 25px;
    color: #888;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>MANIKARNIKA</h1>
    <h2>Multiple Image Auto Cropper</h2>
    <p>Upload • Auto Crop • Preview • Download All</p>
</header>

<label class="upload" for="files">
    <h3>📁 SELECT MULTIPLE IMAGES</h3>
    <p>Click here or drag and drop images</p>
    <small>JPG, JPEG, PNG, WEBP</small>
</label>

<input type="file" id="files" accept="image/*" multiple hidden>

<div class="controls">

    <div>
        <label>Crop Size / Ratio</label>
        <select id="ratio">
            <option value="1">1 : 1 Square</option>
            <option value="0.6666667">4 : 6 Portrait</option>
            <option value="1.5">6 : 4 Landscape</option>
            <option value="0.75">3 : 4 Portrait</option>
            <option value="1.7777778">16 : 9 Landscape</option>
            <option value="0.7777778">Passport 3.5 : 4.5</option>
            <option value="original">Original Size</option>
        </select>
    </div>

    <div>
        <label>Output Format</label>
        <select id="format">
            <option value="image/jpeg">JPG</option>
            <option value="image/png">PNG</option>
        </select>
    </div>

</div>

<div class="buttons">
    <button class="download" id="download" disabled>
        ⬇ DOWNLOAD ALL IMAGES (ZIP)
    </button>

    <button class="reset" id="reset">
        RESET
    </button>
</div>

<div id="status">Please select your images.</div>

<h3>Image Preview</h3>

<div class="grid" id="preview"></div>

<footer>
    MANIKARNIKA SOFTWARE & EMBEDDED SYSTEMS
    <br>Multiple Image Processing Tool
</footer>

</div>

<script>

const fileInput = document.getElementById("files");
const ratioSelect = document.getElementById("ratio");
const formatSelect = document.getElementById("format");
const preview = document.getElementById("preview");
const statusBox = document.getElementById("status");
const downloadBtn = document.getElementById("download");
const resetBtn = document.getElementById("reset");

let selectedFiles = [];
let croppedImages = [];
let processNumber = 0;

// Upload images
fileInput.addEventListener("change", function() {
    selectedFiles = Array.from(this.files)
        .filter(file => file.type.startsWith("image/"));

    processImages();
});

// Drag and drop
const dropArea = document.querySelector(".upload");

dropArea.addEventListener("dragover", e => {
    e.preventDefault();
    dropArea.style.background = "#ffe2bf";
});

dropArea.addEventListener("dragleave", () => {
    dropArea.style.background = "#fff8ef";
});

dropArea.addEventListener("drop", e => {
    e.preventDefault();
    dropArea.style.background = "#fff8ef";

    selectedFiles = Array.from(e.dataTransfer.files)
        .filter(file => file.type.startsWith("image/"));

    processImages();
});

// Re-crop when settings change
ratioSelect.addEventListener("change", processImages);
formatSelect.addEventListener("change", processImages);

function clearImages() {
    croppedImages.forEach(item => {
        URL.revokeObjectURL(item.url);
    });

    croppedImages = [];
    preview.innerHTML = "";
}

// Process all images
async function processImages() {

    const currentProcess = ++processNumber;

    clearImages();

    downloadBtn.disabled = true;

    if (selectedFiles.length === 0) {
        statusBox.textContent = "Please select images first.";
        return;
    }

    const ratio = ratioSelect.value;
    const format = formatSelect.value;

    statusBox.textContent =
        "Processing " + selectedFiles.length + " images...";

    for (let i = 0; i < selectedFiles.length; i++) {

        if (currentProcess !== processNumber) return;

        const file = selectedFiles[i];

        statusBox.textContent =
            "Cropping image " + (i + 1) +
            " of " + selectedFiles.length;

        try {

            const blob = await cropImage(file, ratio, format);

            if (currentProcess !== processNumber) return;

            const extension =
                format === "image/png" ? ".png" : ".jpg";

            const name = file.name.replace(/\.[^.]+$/, "");

            const outputName =
                String(i + 1).padStart(3, "0") +
                "_" + name + extension;

            const url = URL.createObjectURL(blob);

            const imageData = {
                name: outputName,
                blob: blob,
                url: url
            };

            croppedImages.push(imageData);

            showPreview(imageData);

        } catch (error) {
            console.error(error);
        }
    }

    if (currentProcess !== processNumber) return;

    statusBox.textContent =
        croppedImages.length + " images cropped successfully.";

    downloadBtn.disabled = croppedImages.length === 0;
}

// Crop individual image
function cropImage(file, ratioValue, format) {

    return new Promise((resolve, reject) => {

        const image = new Image();
        const objectURL = URL.createObjectURL(file);

        image.onload = function() {

            try {

                const width = image.naturalWidth;
                const height = image.naturalHeight;

                let cropWidth = width;
                let cropHeight = height;
                let startX = 0;
                let startY = 0;

                if (ratioValue !== "original") {

                    const targetRatio = Number(ratioValue);
                    const sourceRatio = width / height;

                    if (sourceRatio > targetRatio) {

                        cropWidth = height * targetRatio;

                        startX = (width - cropWidth) / 2;

                    } else {

                        cropHeight = width / targetRatio;

                        startY = (height - cropHeight) / 2;
                    }
                }

                const canvas = document.createElement("canvas");

                canvas.width = Math.round(cropWidth);
                canvas.height = Math.round(cropHeight);

                const ctx = canvas.getContext("2d");

                // White background for JPG
                if (format === "image/jpeg") {
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // Draw cropped image
                ctx.drawImage(
                    image,
                    startX,
                    startY,
                    cropWidth,
                    cropHeight,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );

                canvas.toBlob(blob => {

                    URL.revokeObjectURL(objectURL);

                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error("Image conversion failed"));
                    }

                }, format, 0.95);

            } catch (error) {

                URL.revokeObjectURL(objectURL);
                reject(error);

            }
        };

        image.onerror = function() {
            URL.revokeObjectURL(objectURL);
            reject(new Error("Cannot read image"));
        };

        image.src = objectURL;

    });
}

// Display preview
function showPreview(item) {

    const card = document.createElement("div");
    card.className = "item";

    const img = document.createElement("img");
    img.src = item.url;

    const name = document.createElement("p");
    name.textContent = item.name;

    card.appendChild(img);
    card.appendChild(name);

    preview.appendChild(card);
}

// Download all images in one ZIP
downloadBtn.addEventListener("click", async function() {

    if (croppedImages.length === 0) return;

    if (typeof JSZip === "undefined") {
        statusBox.textContent =
            "ZIP library not loaded. Check your internet connection.";
        return;
    }

    downloadBtn.disabled = true;

    statusBox.textContent = "Creating ZIP file...";

    try {

        const zip = new JSZip();

        croppedImages.forEach(item => {
            zip.file(item.name, item.blob);
        });

        const zipBlob = await zip.generateAsync({
            type: "blob",
            compression: "DEFLATE",
            compressionOptions: {
                level: 5
            }
        }, metadata => {

            statusBox.textContent =
                "Creating ZIP: " +
                Math.round(metadata.percent) + "%";

        });

        const url = URL.createObjectURL(zipBlob);

        const link = document.createElement("a");

        link.href = url;
        link.download = "MANIKARNIKA_CROPPED_IMAGES.zip";

        document.body.appendChild(link);
        link.click();
        link.remove();

        setTimeout(() => URL.revokeObjectURL(url), 30000);

        statusBox.textContent =
            "ZIP file downloaded successfully!";

    } catch (error) {

        statusBox.textContent = "ZIP creation failed.";

        console.error(error);

    }

    downloadBtn.disabled = false;
});

// Reset everything
resetBtn.addEventListener("click", function() {

    processNumber++;

    clearImages();

    selectedFiles = [];

    fileInput.value = "";

    downloadBtn.disabled = true;

    statusBox.textContent = "Ready for new images.";

});

</script>

</body>
</html>
