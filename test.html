
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First Supabase Database</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial;
    background: #f0f4f8;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #ccc;
}

input, textarea, button {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    box-sizing: border-box;
}

button {
    background: #16845b;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.record {
    background: #eef8f2;
    padding: 12px;
    margin-top: 10px;
    border-radius: 7px;
    overflow-wrap: anywhere;
}

#status {
    color: #16845b;
}
</style>
</head>

<body>

<div class="container">

<h2>Supabase Database Demo</h2>

<p>Write data into your database</p>

<form id="myForm">

<input
type="text"
id="name"
placeholder="Enter your name"
required>

<textarea
id="message"
placeholder="Enter your message"
required></textarea>

<button type="submit" id="saveButton">
SAVE TO DATABASE
</button>

</form>

<hr>

<h3>Read Database Records</h3>

<button type="button" id="readButton">
READ DATA
</button>

<p id="status">Waiting for connection...</p>

<div id="records"></div>

</div>

<script>

// 1. ENTER YOUR SUPABASE DETAILS

const SUPABASE_URL = "YOUR_PROJECT_URL";

const SUPABASE_KEY = "YOUR_PUBLISHABLE_KEY";

// 2. CONNECT DATABASE

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// 3. WRITE DATA

document.getElementById("myForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const message = document.getElementById("message").value.trim();

    const button = document.getElementById("saveButton");
    const status = document.getElementById("status");

    button.disabled = true;
    status.textContent = "Saving data...";

    try {

        const { error } = await db
            .from("demo_messages")
            .insert({
                name: name,
                message: message
            });

        if (error) {
            throw error;
        }

        document.getElementById("myForm").reset();

        await readData();

        status.textContent = "Data saved successfully!";

    } catch(error) {

        status.textContent = "Error: " + error.message;

    } finally {

        button.disabled = false;

    }

});

// 4. READ DATA

async function readData() {

    const status = document.getElementById("status");
    const records = document.getElementById("records");

    status.textContent = "Reading database...";

    try {

        const { data, error } = await db
            .from("demo_messages")
            .select("id,name,message,created_at")
            .order("created_at", { ascending: false });

        if (error) {
            throw error;
        }

        records.replaceChildren();

        if (data.length === 0) {
            records.textContent = "No records found.";
        }

        data.forEach(function(item) {

            const card = document.createElement("div");
            card.className = "record";

            const heading = document.createElement("h3");
            heading.textContent = item.name;

            const message = document.createElement("p");
            message.textContent = item.message;

            const date = document.createElement("small");
            date.textContent = new Date(
                item.created_at
            ).toLocaleString();

            card.append(heading, message, date);
            records.appendChild(card);

        });

        status.textContent =
            data.length + " record(s) loaded.";

    } catch(error) {

        status.textContent = "Read error: " + error.message;

    }

}

// 5. READ BUTTON

document.getElementById("readButton")
.addEventListener("click", readData);

// Initial database reading
readData();

</script>

</body>
</html>
