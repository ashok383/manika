<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manikarnika - Split PDF | Single to Multiple ✨</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
    min-height:100vh;
    background: radial-gradient(circle at bottom, #1e1b4b, #020617);
    display:flex;align-items:center;justify-content:center;
    padding:20px;position:relative;overflow:hidden;
}
body::after{
    content:"";position:absolute;width:200%;height:200%;
    background: radial-gradient(2px 2px at 10% 20%, #fff, transparent),
                radial-gradient(2px 2px at 80% 80%, #a5b4fc, transparent);
    animation: stars 80s linear infinite;
}
@keyframes stars{0%{transform:translateY(0)}100%{transform:translateY(-600px)}}

.card{
    position:relative;z-index:2;width:100%;max-width:500px;
    background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
    backdrop-filter: blur(22px);
    border:1px solid rgba(255,255,255,0.18);
    border-radius:26px;padding:28px;
    box-shadow:0 25px 70px rgba(0,0,0,0.6), inset 0 0 25px rgba(255,255,255,0.08);
    overflow:hidden;
}
.shine{
    position:absolute;top:-60%;left:-60%;width:200%;height:200%;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
    transform:rotate(25deg);animation: shineMove 3.5s infinite;
}
@keyframes shineMove{0%{transform:translateX(-110%) rotate(25deg)}100%{transform:translateX(110%) rotate(25deg)}}

h1{
    text-align:center;font-size:22px;font-weight:700;
    background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.sub{text-align:center;color:#94a3b8;font-size:12px;margin:6px 0 18px}

.drop-zone{
    border:2px dashed rgba(147,197,253,0.4);
    border-radius:18px;padding:28px;text-align:center;cursor:pointer;
    background: linear-gradient(135deg, rgba(59,130,246,0.12), rgba(168,85,247,0.12));
    transition:0.3s;
}
.drop-zone:hover{border-color:#60a5fa;box-shadow:0 0 30px rgba(96,165,250,0.35);transform:translateY(-2px)}
.icon{font-size:44px;animation: float 2.2s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.drop-zone p{color:#fff;font-weight:600;margin-top:8px}

.info-box{
    margin:14px 0;padding:12px;border-radius:12px;
    background: rgba(0,0,0,0.35);border:1px solid rgba(255,255,255,0.1);
    color:#cbd5e1;font-size:12px;display:none;
}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.mode-btn{
    padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);color:#e2e8f0;
    cursor:pointer;font-size:12px;font-weight:600;transition:0.3s;
}
.mode-btn.active{
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color:#fff;box-shadow:0 6px 20px rgba(59,130,246,0.4);border-color:transparent;
}

.split-btn{
    width:100%;padding:14px;border:none;border-radius:14px;
    font-size:15px;font-weight:700;cursor:pointer;
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
    color:#fff;box-shadow:0 10px 30px rgba(96,165,250,0.45);
    transition:0.3s;
}
.split-btn:hover{transform:scale(1.02);box-shadow:0 14px 40px rgba(96,165,250,0.6)}
.split-btn:disabled{opacity:0.45;cursor:not-allowed}

.range-input{
    width:100%;padding:10px;border-radius:10px;
    background: rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.15);
    color:#fff;margin:10px 0;font-size:13px;display:none;
}

.success{
    display:none;text-align:center;margin-top:14px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    padding:12px;border-radius:12px;color:#fff;font-weight:600;
}
.footer{margin-top:16px;text-align:center;color:#64748b;font-size:11px}
.footer a{color:#93c5fd;text-decoration:none}
</style>
</head>
<body>

<div class="card">
<div class="shine"></div>
<h1>✂️ Manikarnika PDF Splitter ✨</h1>
<p class="sub">Single PDF → Multiple PDFs | 2 Sec Magic</p>

<div class="drop-zone" id="dropZone" onclick="document.getElementById('pdfInput').click()">
<div class="icon">📕💫</div>
<p>Tap to Upload Single PDF</p>
<p style="font-size:11px;color:#94a3b8;font-weight:400">Max 50MB - 100% Private</p>
<input type="file" id="pdfInput" accept=".pdf" hidden>
</div>

<div class="info-box" id="infoBox">📄 <span id="pageCount"></span> Pages Detected</div>

<div class="modes">
<button class="mode-btn active" data-mode="each">📄 Each Page = 1 PDF</button>
<button class="mode-btn" data-mode="custom">✂️ Custom Range</button>
</div>

<input type="text" id="rangeInput" class="range-input" placeholder="Ex: 1-3, 4, 5-8  (like 1-3 ante 1,2,3 pages kalipi)">

<button class="split-btn" id="splitBtn" disabled>🔮 Split Now - Get ZIP File!</button>

<div class="success" id="successMsg">✅ Splitted! Downloading ZIP... 🎉📦</div>

<div class="footer">Made for <a href="https://ashok383.github.io/manika/" target="_blank">Manikarnika Resume Builder</a> | Secure & Shining ✨</div>
</div>

<script>
const { PDFDocument } = PDFLib;
let pdfDoc = null, fileName = 'document';
let mode = 'each';

document.querySelectorAll('.mode-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
        document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        document.getElementById('rangeInput').style.display = mode==='custom'?'block':'none';
    });
});

const fileInput = document.getElementById('pdfInput');
const dropZone = document.getElementById('dropZone');

fileInput.addEventListener('change', e=> loadPDF(e.target.files[0]));
dropZone.addEventListener('dragover', e=>{e.preventDefault(); dropZone.style.borderColor='#60a5fa'});
dropZone.addEventListener('dragleave', ()=>dropZone.style.borderColor='rgba(147,197,253,0.4)');
dropZone.addEventListener('drop', e=>{e.preventDefault(); loadPDF(e.dataTransfer.files[0]);});

async function loadPDF(file){
    if(!file || file.type!=='application/pdf') return alert('PDF file only!');
    fileName = file.name.replace('.pdf','');
    const buf = await file.arrayBuffer();
    pdfDoc = await PDFDocument.load(buf);
    document.getElementById('pageCount').innerText = pdfDoc.getPageCount();
    document.getElementById('infoBox').style.display='block';
    document.getElementById('splitBtn').disabled=false;
    document.getElementById('splitBtn').innerHTML=`✂️ Split ${pdfDoc.getPageCount()} Pages - Ready! ✨`;
}

document.getElementById('splitBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('splitBtn');
    btn.disabled=true; btn.innerHTML='⏳ Splitting Magic... ✨';
    
    const zip = new JSZip();
    const total = pdfDoc.getPageCount();
    
    if(mode==='each'){
        for(let i=0;i<total;i++){
            const newPdf = await PDFDocument.create();
            const [page] = await newPdf.copyPages(pdfDoc, [i]);
            newPdf.addPage(page);
            const bytes = await newPdf.save();
            zip.file(`${fileName}_Page_${i+1}.pdf`, bytes);
        }
    } else {
        // Custom: 1-3, 4, 5-8
        const rangeStr = document.getElementById('rangeInput').value.trim();
        if(!rangeStr) return alert('Enter range like 1-3, 4, 5-8');
        const parts = rangeStr.split(',').map(s=>s.trim());
        let idx=1;
        for(let part of parts){
            let pages=[];
            if(part.includes('-')){
                let [s,e]=part.split('-').map(Number);
                for(let p=s;p<=e;p++) pages.push(p-1);
            } else {
                pages.push(Number(part)-1);
            }
            const newPdf = await PDFDocument.create();
            const copied = await newPdf.copyPages(pdfDoc, pages);
            copied.forEach(p=>newPdf.addPage(p));
            const bytes = await newPdf.save();
            zip.file(`${fileName}_Part_${idx++}_(${part}).pdf`, bytes);
        }
    }
    
    const zipBlob = await zip.generateAsync({type:'blob'});
    const url = URL.createObjectURL(zipBlob);
    const a = document.createElement('a');
    a.href=url; a.download=`${fileName}_Splitted_Manikarnika.zip`; a.click();
    
    document.getElementById('successMsg').style.display='block';
    setTimeout(()=>{document.getElementById('successMsg').style.display='none'; btn.innerHTML=`🔮 Split Now - Get ZIP File!`; btn.disabled=false;},3000);
});
</script>
</body>
</html>
