<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">


<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #f4f6fc;
  --surface: #ffffff;
  --primary: #6558e8;
  --primary-dark: #4939c9;
  --text: #182039;
  --muted: #69738a;
  --border: #e2e7f0;
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  color: var(--text);
  background:
    radial-gradient(ellipse at top left, #e7e6ff, transparent 42%),
    var(--bg);
  font-family: 'Inter', Arial, sans-serif;
  line-height: 1.6;
}

.container {
  max-width: 960px;
  margin: 22px auto;
  padding: clamp(20px, 4vw, 42px);
  background: var(--surface);
  border: 1px solid rgba(226, 231, 240, .9);
  border-radius: 24px;
  box-shadow: 0 24px 70px rgba(28, 37, 75, .09);
}

h1, h2, h3, h4 {
  color: var(--text);
  letter-spacing: -.5px;
}

.container h4 {
  margin: 0 0 28px;
  padding-bottom: 22px;
  text-align: center;
  font-size: clamp(23px, 4vw, 34px);
  font-weight: 800;
  color: var(--primary);
  border-bottom: 1px solid var(--border);
}

label {
  display: block;
  margin: 18px 0 7px;
  color: #303a55;
  font-size: 13px;
  font-weight: 700;
}

input:not([type="radio"]):not([type="checkbox"]):not([type="file"]),
textarea,
select {
  display: block;
  width: 100%;
  min-width: 0;
  margin: 0 0 12px;
  padding: 12px 14px;
  color: var(--text);
  background: #fbfcff;
  border: 1px solid #dce2ee;
  border-radius: 10px;
  font: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
}

input:focus,
textarea:focus,
select:focus {
  background: #fff;
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(101, 88, 232, .12);
}

input[type="file"] {
  display: block;
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  background: #f8f8ff;
  border: 1px dashed #aaa4ef;
  border-radius: 12px;
}

textarea {
  resize: vertical;
  min-height: 85px;
}

button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 12px 18px;
  margin: 6px 5px 6px 0;
  border: 1px solid transparent;
  border-radius: 10px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s, background .2s;
}

button:hover {
  transform: translateY(-1px);
  box-shadow: 0 7px 18px rgba(30, 40, 80, .12);
}

.add-btn {
  color: var(--primary);
  background: #efedff;
  border-color: #dedaff;
}

.remove-btn {
  flex: 0 0 auto;
  color: #c43248;
  background: #fff0f2;
}

.preview-btn {
  color: white;
  background: linear-gradient(135deg, #7868f4, #5141d0);
  box-shadow: 0 7px 18px rgba(101, 88, 232, .22);
}

.download-btn{background:#00c853;color:#fff}
}

@keyframes shine {
  0% { left: -100%; }
  100% { left: 100%; }
}

#academicsContainer {
  display: grid;
  gap: 10px;
}

.academicRow {
  align-items: center;
  flex-wrap: wrap;
  padding: 12px;
  background: #f8f9fd;
  border: 1px solid var(--border);
  border-radius: 12px;
}

.academicRow input {
  flex: 1 1 130px;
}

.container > div[style*="dashed"] {
  background: #f8f8ff !important;
  border: 1px solid #dedaff !important;
  border-radius: 16px !important;
  padding: 20px !important;
}

.container > div[style*="dashed"] label {
  padding: 12px;
  margin: 7px 0;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 10px;
}

.container > div[style*="dashed"] input[type="radio"] {
  accent-color: var(--primary);
}

@media (max-width: 768px) {
  body {
    padding: 12px;
    background: var(--bg);
  }
  .container {
    margin: 0 auto;
    padding: 20px 16px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(28,37,75,.08);
  }
  .container h4 {
    margin-bottom: 18px;
    padding-bottom: 16px;
    font-size: 24px;
  }
  label {
    margin: 14px 0 6px;
  }
  button {
    max-width: 100%;
    width: 100%;
    margin: 8px 0;
    padding: 14px;
    font-size: 14px;
  }
  .preview-btn,
  .download-btn {
    width: 100%;
  }
  .academicRow {
    display: grid !important;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .academicRow input {
    flex-basis: 100%;
  }
  .academicRow input:nth-child(1),
  .academicRow input:nth-child(2) {
    grid-column: span 2;
  }
} 
</style>

.top-banner::after{content:'';position:absolute;bottom:-20px;left:0;right:0;height:40px;background:#fff;border-radius:50% 50% 0 0}
.header{display:flex;gap:22px;align-items:center;position:relative;z-index:2}
.header img{width:110px;height:110px;border-radius:18px;object-fit:cover;border:3px solid rgba(255,255,255,0.8);box-shadow:0 8px 20px rgba(0,0,0,0.2)}
.header h1{margin:0;font-family:'Poppins';font-size:32px;font-weight:700;letter-spacing:-0.5px}
.header p{margin:3px 0;font-size:13px;opacity:0.92}
.contact-bar{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);padding:10px 14px;border-radius:12px}
.content{padding:30px 35px 20px}
.section{margin-bottom:22px}
.section-title{font-family:'Poppins';font-size:13px;font-weight:700;letter-spacing:1px;color:#6558e8;text-transform:uppercase;border-left:4px solid #6558e8;padding-left:12px;margin:0 0 10px 0}
.section-box{background:#f8f9ff;border:1px solid #eef0ff;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.7;color:#2d3748}
table{width:100%;border-collapse:collapse;overflow:hidden;border-radius:10px}
th{background:linear-gradient(135deg,#6558e8,#7868f4);color:#fff;padding:10px;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
td{padding:10px;border-bottom:1px solid #eef0ff;font-size:13px}
tr:last-child td{border-bottom:none}tr:nth-child(even) td{background:#f8f9ff}
.skill-chip{display:inline-block;background:linear-gradient(135deg,#6558e8,#00d2ff);color:#fff;padding:6px 14px;border-radius:20px;margin:4px;font-size:12px;font-weight:600;box-shadow:0 3px 10px rgba(101,88,232,0.25)}
.footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-block;background:#e0e7ff;color:#4338ca;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-left:10px}
.declaration-box{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:1px dashed #f59e0b;border-radius:12px}
.signature{font-family:'Poppins';font-size:18px;font-weight:700;color:#182039}
.model-badge{text-align:center;margin-top:20px;padding:10px;background:linear-gradient(135deg,#f3f0ff,#e0f7ff);border-radius:10px;font-size:12px;color:#6558e8;font-weight:600}
.close-bar{position:fixed;bottom:0;left:0;width:100%;background:rgba(24,32,57,0.9);backdrop-filter:blur(12px);text-align:center;padding:12px;z-index:99}
.close-bar button{background:#fff;color:#182039;border:none;border-radius:30px;padding:10px 28px;font-weight:700;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
</style>
</head>
<body>
<div class="page">
  <div class="top-banner">
    <div class="header">
      ${photoSrc?`<img src="${photoSrc}">`:`<div style="width:110px;height:110px;background:rgba(255,255,255,0.2);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:40px">👤</div>`}
      <div style="flex:1">
        <h1>${fullName}</h1>
        <div style="margin-top:6px;font-size:13px;"><span>👨 ${fatherName}</span> &nbsp;|&nbsp; <span>👩 ${motherName}</span> &nbsp;|&nbsp; <span>🎂 ${dob}</span></div>
        <div class="contact-bar"><span>📧 ${email}</span><span>📱 ${phone}</span><span>📍 ${address}</span></div>
      </div>
    </div>
  </div>
  <div class="content">
    <div class="section"><div class="section-title">🎯 Career Objective</div><div class="section-box">${objective}</div></div>
    <div class="section"><div class="section-title">💼 Professional Summary</div><div class="section-box">${summary}</div></div>
    <div class="section"><div class="section-title">🎓 Academic Details</div><div class="section-box" style="padding:0;overflow:hidden"><table><tr><th>Course</th><th>Institute</th><th>Year</th><th>GPA</th></tr>${academicsHTML}</table></div></div>
    <div class="footer-grid">
      <div class="section"><div class="section-title">📚 Education</div><div class="section-box">${education}</div></div>
      <div class="section"><div class="section-title">💻 Experience</div><div class="section-box">${experience}</div></div>
    </div>
    <div class="section"><div class="section-title">⚡ Technical Skills</div><div class="section-box">${skillsHTML}</div></div>
    <div class="footer-grid">
      <div class="section"><div class="section-title">🚀 Projects</div><div class="section-box">${projects}</div></div>
      <div class="section"><div class="section-title">💪 Strengths</div><div class="section-box">${habits}</div></div>
    </div>
    <div class="section"><div class="section-title">🗣️ Languages</div><div class="section-box">${Languages}</div></div>
    <div class="section"><div class="section-title">📝 Declaration</div><div class="section-box declaration-box">${declaration}</div></div>
    <div style="display:flex;justify-content:space-between;margin-top:20px;padding:16px;background:#f8f9fd;border-radius:12px;font-size:13px">
      <span><b>📍 Place:</b> ${place}</span><span><b>📅 Date:</b> ${date}</span><span><b>✍️ Signature:</b> <span class="signature">${signature}</span></span>
    </div>
    <div class="model-badge">✨ Resume Model: ${selectedModel.toUpperCase()} <span class="badge">MANIKARNIKA</span></div>
  </div>
</div>
<div class="close-bar">
  <button onclick="window.print()" style="background:linear-gradient(135deg,#00d2ff,#0097a7);color:#fff;margin-right:10px">🖨️ Print</button>
  <button onclick="window.close()">❌ Close</button>
</div>
</body>
</html>
`);
    w.document.close();
}

function payAndDownload(){
    const selected=document.querySelector('input[name="resumeModel"]:checked');
    if(!selected){alert("Select Model!");return;}
    const options={
        key:"rzp_live_Tn3hozihdEiMSy",
        amount:5000, currency:"INR", name:"MANIKARNIKA", description:selected.value,
        handler:function(res){alert("Payment Success ✅ "+res.razorpay_payment_id); previewCV();},
        theme:{color:"#00d2ff"}
    };
    const rzp=new Razorpay(options);
    rzp.open();
}
</script>
</body>
</html>



</script>
<script src="script.js"></script>

</body>
</html>
