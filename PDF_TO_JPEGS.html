<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MANIK-A-RNIKA | PDF to JPEG</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Segoe UI,sans-serif;
}

body{
  min-height:100vh;
  background:#f1f3f6;
  color:#202124;
  padding:15px;
}

.app{
  width:100%;
  max-width:600px;
  margin:auto;
}

.header{
  background:#fff;
  border-radius:22px;
  padding:20px;
  text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  margin-bottom:15px;
}

.header h1{
  font-size:23px;
  color:#1769e0;
}

.header p{
  font-size:13px;
  color:#777;
  margin-top:5px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:18px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.upload{
  display:block;
  border:2px dashed #4285f4;
  border-radius:18px;
  padding:35px 15px;
  text-align:center;
  background:#f7faff;
  cursor:pointer;
}

.upload-icon{
  font-size:45px;
}

.upload h3{
  margin-top:8px;
  font-size:17px;
}

.upload p{
  margin-top:5px;
  color:#777;
  font-size:12px;
}

input[type=file]{
  display:none;
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.setting{
  background:#f5f6f7;
  border-radius:15px;
  padding:12px;
}

.setting label{
  display:block;
  color:#666;
  font-size:12px;
  margin-bottom:6px;
}

.setting select{
  width:100%;
  border:0;
  background:transparent;
  outline:0;
  font-size:14px;
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:25px;
  margin-top:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#1769e0;
  color:#fff;
}

.clear{
  background:#e8f0fe;
  color:#1769e0;
}

.preview{
  margin-top:15px;
}

.preview h3{
  font-size:14px;
  margin-bottom:10px;
}

.pages{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.page{
  background:#f5f5f5;
  border-radius:15px;
  padding:8px;
  text-align:center;
}

.page canvas{
  width:100%;
  display:block;
  border-radius:8px;
  background:#fff;
}

.page button{
  width:100%;
  border:0;
  background:#1769e0;
  color:#fff;
  border-radius:18px;
  padding:8px;
  margin-top:7px;
  cursor:pointer;
  font-size:12px;
  font-weight:bold;
}

.status{
  text-align:center;
  font-size:12px;
  color:#666;
  margin-top:12px;
  min-height:18px;
}

.footer{
  text-align:center;
  font-size:11px;
  color:#999;
  margin-top:15px;
}

@media(max-width:400px){
  .pages{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<h1>🖼️ PDF to JPEG</h1>

<p>
MANIK-A-RNIKA PDF Tools
</p>

</div>


<div class="card">


<label class="upload">

<div class="upload-icon">
📄
</div>

<h3>
Select PDF
</h3>

<p>
Choose a PDF file from your device
</p>

<input
  type="file"
  id="pdfInput"
  accept="application/pdf"
>

</label>


<div class="settings">

<div class="setting">

<label>
Image Quality
</label>

<select id="quality">

<option value="1">
Maximum
</option>

<option value=".92">
High
</option>

<option value=".8">
Medium
</option>

</select>

</div>


<div class="setting">

<label>
Resolution
</label>

<select id="scale">

<option value="2">
High
</option>

<option value="1.5">
Medium
</option>

<option value="1">
Normal
</option>

</select>

</div>

</div>


<button
  class="btn clear"
  onclick="clearPDF()"
>
🗑 Clear
</button>


<div class="preview">

<h3>
Converted Pages
</h3>

<div
  class="pages"
  id="pages"
>
</div>

</div>


<button
  class="btn primary"
  onclick="downloadAll()"
>
⬇ Download All JPEG
</button>


<div
  class="status"
  id="status"
>
Select a PDF to begin
</div>


</div>


<div class="footer">
© 2026 MANIK-A-RNIKA
</div>

</div>


<!-- PDF.JS -->

<script
src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs"
type="module">
</script>


<script type="module">

import * as pdfjsLib
from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


/*
  PDF.js worker
*/

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";


const pdfInput =
document.getElementById("pdfInput");

const pagesContainer =
document.getElementById("pages");

const status =
document.getElementById("status");

const scaleSelect =
document.getElementById("scale");

const qualitySelect =
document.getElementById("quality");


let convertedPages = [];


/* ==========================================
   SELECT PDF
========================================== */

pdfInput.addEventListener(
  "change",
  async function(){

    const file =
      this.files[0];

    if(!file)
      return;


    await convertPDF(file);

  }
);


/* ==========================================
   CONVERT PDF
========================================== */

async function convertPDF(file){

  pagesContainer.innerHTML = "";

  convertedPages = [];


  status.textContent =
    "Loading PDF...";


  try{

    const buffer =
      await file.arrayBuffer();


    const pdf =
      await pdfjsLib.getDocument({
        data:buffer
      }).promise;


    status.textContent =
      `Found ${pdf.numPages} page(s)`;


    const scale =
      parseFloat(
        scaleSelect.value
      );


    for(
      let pageNumber = 1;
      pageNumber <= pdf.numPages;
      pageNumber++
    ){

      status.textContent =
        `Converting page ${pageNumber} of ${pdf.numPages}...`;


      const page =
        await pdf.getPage(
          pageNumber
        );


      const viewport =
        page.getViewport({
          scale:scale
        });


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        Math.ceil(
          viewport.width
        );


      canvas.height =
        Math.ceil(
          viewport.height
        );


      const ctx =
        canvas.getContext(
          "2d"
        );


      ctx.fillStyle =
        "#ffffff";


      ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      await page.render({

        canvasContext:ctx,

        viewport:viewport

      }).promise;


      const quality =
        parseFloat(
          qualitySelect.value
        );


      const jpeg =
        canvas.toDataURL(
          "image/jpeg",
          quality
        );


      convertedPages.push({
        page:pageNumber,
        data:jpeg
      });


      showPage(
        pageNumber,
        canvas,
        jpeg
      );

    }


    status.textContent =
      `✅ ${pdf.numPages} page(s) converted successfully`;

  }
  catch(error){

    console.error(error);

    status.textContent =
      "❌ Unable to convert PDF.";

    alert(
      "The PDF could not be processed."
    );

  }

}


/* ==========================================
   SHOW PAGE
========================================== */

function showPage(
  number,
  canvas,
  jpeg
){

  const box =
    document.createElement(
      "div"
    );

  box.className =
    "page";


  const preview =
    document.createElement(
      "canvas"
    );


  const maxWidth =
    260;


  const ratio =
    Math.min(
      1,
      maxWidth /
      canvas.width
    );


  preview.width =
    canvas.width * ratio;


  preview.height =
    canvas.height * ratio;


  const ctx =
    preview.getContext(
      "2d"
    );


  ctx.drawImage(
    canvas,
    0,
    0,
    preview.width,
    preview.height
  );


  const button =
    document.createElement(
      "button"
    );


  button.textContent =
    `⬇ Download Page ${number}`;


  button.onclick =
    function(){

      downloadJPEG(
        jpeg,
        `MANIK-A-RNIKA_page_${number}.jpg`
      );

    };


  box.appendChild(
    preview
  );

  box.appendChild(
    button
  );


  pagesContainer.appendChild(
    box
  );

}


/* ==========================================
   DOWNLOAD JPEG
========================================== */

function downloadJPEG(
  data,
  filename
){

  const a =
    document.createElement(
      "a"
    );


  a.href =
    data;


  a.download =
    filename;


  document.body.appendChild(a);

  a.click();

  a.remove();

}


/* ==========================================
   DOWNLOAD ALL
========================================== */

window.downloadAll =
function(){

  if(
    convertedPages.length === 0
  ){

    alert(
      "Please select a PDF first."
    );

    return;

  }


  convertedPages.forEach(
    (item,index) => {

      setTimeout(
        function(){

          downloadJPEG(
            item.data,
            `MANIK-A-RNIKA_page_${item.page}.jpg`
          );

        },
        index * 300
      );

    }
  );

};


/* ==========================================
   CLEAR
========================================== */

window.clearPDF =
function(){

  pdfInput.value = "";

  pagesContainer.innerHTML = "";

  convertedPages = [];

  status.textContent =
    "Select a PDF to begin";

};

</script>

</body>
</html>
