<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ Word to PDF Converter</title>

<!-- Mammoth: DOCX text extraction -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    padding:25px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color:white;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(0,255,255,.20),
            transparent 25%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(255,0,255,.18),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(0,110,255,.20),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #050914,
            #0d1730,
            #070b19
        );
}


/* MAIN */

.container{
    max-width:1200px;
    margin:auto;

    padding:30px;

    border-radius:30px;

    background:
        rgba(255,255,255,.065);

    border:
        1px solid rgba(255,255,255,.18);

    backdrop-filter:
        blur(22px);

    box-shadow:
        0 0 35px rgba(0,255,255,.12),
        0 0 90px rgba(140,0,255,.12),
        inset 0 0 30px rgba(255,255,255,.035);

    position:relative;

    overflow:hidden;
}


/* SHINING LIGHT */

.container::before{

    content:"";

    position:absolute;

    top:-100%;
    left:-50%;

    width:30%;
    height:300%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.10),
            transparent
        );

    transform:rotate(25deg);

    animation:
        shine 7s infinite;

    pointer-events:none;
}

@keyframes shine{

    0%{
        left:-50%;
    }

    45%,100%{
        left:140%;
    }

}


/* HEADER */

.header{
    position:relative;
    z-index:2;

    text-align:center;

    margin-bottom:30px;
}

.header h1{

    font-size:40px;

    font-weight:900;

    letter-spacing:1px;

    background:
        linear-gradient(
            90deg,
            #00ffff,
            #ffffff,
            #ff66ff,
            #ffffff,
            #00ffff
        );

    background-size:400%;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        textShine 5s linear infinite;

    text-shadow:
        0 0 20px rgba(0,255,255,.25);
}

@keyframes textShine{

    0%{
        background-position:0%;
    }

    100%{
        background-position:400%;
    }

}

.header p{

    margin-top:10px;

    color:#b9c8dc;

    font-size:15px;
}


.badges{
    margin-top:13px;
}


.badge{

    display:inline-block;

    padding:7px 13px;

    margin:4px;

    border-radius:30px;

    background:
        rgba(0,255,255,.07);

    border:
        1px solid rgba(0,255,255,.20);

    color:#8ffaff;

    font-size:12px;

    box-shadow:
        0 0 15px rgba(0,255,255,.08);
}


/* UPLOAD */

.upload{

    position:relative;
    z-index:2;

    display:block;

    border:
        2px dashed rgba(0,255,255,.55);

    border-radius:24px;

    padding:45px 20px;

    text-align:center;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            rgba(0,255,255,.055),
            rgba(255,0,255,.055)
        );

    transition:.3s;

    box-shadow:
        0 0 25px rgba(0,255,255,.08),
        inset 0 0 25px rgba(255,255,255,.025);
}

.upload:hover,
.upload.drag{

    transform:
        translateY(-3px);

    border-color:#00ffff;

    box-shadow:
        0 0 35px rgba(0,255,255,.25),
        inset 0 0 30px rgba(0,255,255,.05);
}


.upload-icon{

    font-size:65px;

    margin-bottom:12px;

    filter:
        drop-shadow(0 0 10px #00ffff)
        drop-shadow(0 0 25px #0077ff);
}


.upload h2{

    font-size:23px;

    margin-bottom:8px;
}


.upload p{

    color:#aabbd0;

    font-size:14px;
}


.upload small{

    display:block;

    margin-top:10px;

    color:#6e829d;
}


#wordInput{
    display:none;
}


/* CONTROLS */

.controls{

    position:relative;
    z-index:2;

    margin-top:25px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(210px,1fr)
        );

    gap:16px;
}


.control{

    padding:18px;

    border-radius:18px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.13);

    box-shadow:
        inset 0 0 20px rgba(255,255,255,.02);
}


.control label{

    display:block;

    font-weight:bold;

    font-size:13px;

    color:#dce8f7;

    margin-bottom:9px;
}


input,
select{

    width:100%;

    padding:12px 13px;

    border-radius:12px;

    border:
        1px solid rgba(255,255,255,.18);

    background:
        rgba(0,0,0,.28);

    color:white;

    outline:none;

    font-size:15px;
}


input:focus,
select:focus{

    border-color:#00ffff;

    box-shadow:
        0 0 18px rgba(0,255,255,.20);
}


select option{

    background:#111827;
}


/* BUTTONS */

.buttons{

    position:relative;
    z-index:2;

    display:flex;

    flex-wrap:wrap;

    gap:12px;

    margin-top:22px;
}


button{

    border:0;

    padding:13px 21px;

    border-radius:13px;

    color:white;

    font-weight:bold;

    font-size:14px;

    cursor:pointer;

    transition:.25s;
}


button:hover{

    transform:
        translateY(-2px);
}


button:disabled{

    opacity:.4;

    cursor:not-allowed;

    transform:none;
}


.primary{

    background:
        linear-gradient(
            135deg,
            #00c6ff,
            #0072ff
        );

    box-shadow:
        0 0 22px rgba(0,170,255,.35);
}


.primary:hover{

    box-shadow:
        0 0 35px rgba(0,200,255,.55);
}


.success{

    background:
        linear-gradient(
            135deg,
            #00d084,
            #009f6b
        );

    box-shadow:
        0 0 20px rgba(0,255,170,.25);
}


.secondary{

    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #4f46e5
        );
}


.danger{

    background:
        linear-gradient(
            135deg,
            #ff416c,
            #d90035
        );
}


/* PROGRESS */

.progress-area{

    position:relative;
    z-index:2;

    display:none;

    margin-top:24px;
}


.progress-info{

    display:flex;

    justify-content:space-between;

    margin-bottom:8px;

    font-size:13px;

    color:#c5d3e4;
}


.progress{

    height:12px;

    border-radius:20px;

    background:
        rgba(255,255,255,.10);

    overflow:hidden;
}


.progress-bar{

    width:0%;

    height:100%;

    border-radius:20px;

    background:
        linear-gradient(
            90deg,
            #00ffff,
            #0072ff,
            #ff00cc
        );

    box-shadow:
        0 0 18px rgba(0,255,255,.6);

    transition:.3s;
}


/* RESULTS */

.results{

    position:relative;
    z-index:2;

    margin-top:30px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(290px,1fr)
        );

    gap:20px;
}


.empty{

    grid-column:1/-1;

    text-align:center;

    padding:45px 20px;

    border-radius:20px;

    border:
        1px dashed rgba(255,255,255,.14);

    color:#8092aa;
}


/* CARD */

.card{

    overflow:hidden;

    border-radius:21px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.14);

    box-shadow:
        0 0 25px rgba(0,0,0,.18),
        inset 0 0 25px rgba(255,255,255,.02);

    transition:.3s;
}


.card:hover{

    transform:
        translateY(-5px);

    border-color:
        rgba(0,255,255,.35);

    box-shadow:
        0 0 30px rgba(0,255,255,.14);
}


.card-head{

    padding:18px;

    display:flex;

    align-items:center;

    gap:15px;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}


.word-icon{

    width:55px;
    height:55px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:15px;

    font-size:29px;

    background:
        linear-gradient(
            135deg,
            #1677ff,
            #0046b8
        );

    box-shadow:
        0 0 20px rgba(20,110,255,.30);
}


.filename{

    flex:1;

    font-weight:bold;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


.card-body{

    padding:18px;
}


.row{

    display:flex;

    justify-content:space-between;

    gap:10px;

    padding:6px 0;

    font-size:13px;

    color:#aebed2;
}


.status{

    color:#50ffca;
}


.card button{

    width:100%;

    margin-top:12px;
}


/* FOOTER */

.footer{

    position:relative;
    z-index:2;

    text-align:center;

    margin-top:28px;

    color:#71849e;

    font-size:12px;
}


/* MOBILE */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .container{
        padding:18px;
        border-radius:22px;
    }

    .header h1{
        font-size:29px;
    }

    .upload{
        padding:32px 15px;
    }

    .buttons button{
        width:100%;
    }

}

</style>
</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            ✨ WORD → PDF
        </h1>

        <p>
            Convert Word documents into PDF files
        </p>

        <div class="badges">

            <span class="badge">
                ⚡ Fast
            </span>

            <span class="badge">
                🔒 Private
            </span>

            <span class="badge">
                📄 DOCX
            </span>

            <span class="badge">
                📕 PDF
            </span>

            <span class="badge">
                ✨ Shining UI
            </span>

        </div>

    </div>


    <!-- UPLOAD -->

    <label
        class="upload"
        id="upload"
        for="wordInput"
    >

        <div class="upload-icon">
            📝
        </div>

        <h2>
            Select Word Files
        </h2>

        <p>
            Click here or drag & drop Word documents
        </p>

        <small>
            DOCX supported • Multiple files supported
        </small>

    </label>


    <input
        type="file"
        id="wordInput"
        accept=".docx,.doc,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword"
        multiple
    >


    <!-- OPTIONS -->

    <div class="controls">

        <div class="control">

            <label>
                📄 Page Size
            </label>

            <select id="pageSize">

                <option value="a4">
                    A4
                </option>

                <option value="letter">
                    Letter
                </option>

                <option value="legal">
                    Legal
                </option>

            </select>

        </div>


        <div class="control">

            <label>
                📐 Orientation
            </label>

            <select id="orientation">

                <option value="portrait">
                    Portrait
                </option>

                <option value="landscape">
                    Landscape
                </option>

            </select>

        </div>


        <div class="control">

            <label>
                🔠 Font Size
            </label>

            <input
                type="number"
                id="fontSize"
                value="12"
                min="7"
                max="30"
            >

        </div>


        <div class="control">

            <label>
                📏 Margin (mm)
            </label>

            <input
                type="number"
                id="margin"
                value="15"
                min="5"
                max="40"
            >

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            class="primary"
            id="convertBtn"
            disabled
        >
            ⚡ CONVERT TO PDF
        </button>


        <button
            class="success"
            id="downloadAllBtn"
            disabled
        >
            📥 DOWNLOAD ALL
        </button>


        <button
            class="secondary"
            id="selectBtn"
        >
            📂 SELECT AGAIN
        </button>


        <button
            class="danger"
            id="clearBtn"
        >
            🗑️ CLEAR
        </button>

    </div>


    <!-- PROGRESS -->

    <div
        class="progress-area"
        id="progressArea"
    >

        <div class="progress-info">

            <span id="progressText">
                Preparing...
            </span>

            <span id="progressPercent">
                0%
            </span>

        </div>


        <div class="progress">

            <div
                class="progress-bar"
                id="progressBar"
            ></div>

        </div>

    </div>


    <!-- RESULTS -->

    <div
        class="results"
        id="results"
    >

        <div class="empty">

            📂 Select Word files to begin

        </div>

    </div>


    <div class="footer">

        🔒 Documents are processed in your browser.
        No server upload is required.

    </div>


</div>



<script>

/* jsPDF */

const {
    jsPDF
} = window.jspdf;


/* VARIABLES */

let selectedFiles = [];

let convertedFiles = [];


/* ELEMENTS */

const wordInput =
    document.getElementById("wordInput");

const upload =
    document.getElementById("upload");

const convertBtn =
    document.getElementById("convertBtn");

const downloadAllBtn =
    document.getElementById("downloadAllBtn");

const selectBtn =
    document.getElementById("selectBtn");

const clearBtn =
    document.getElementById("clearBtn");

const results =
    document.getElementById("results");

const progressArea =
    document.getElementById("progressArea");

const progressBar =
    document.getElementById("progressBar");

const progressText =
    document.getElementById("progressText");

const progressPercent =
    document.getElementById("progressPercent");


/* FILE SELECT */

wordInput.addEventListener(
    "change",
    function(){

        selectedFiles =
            Array.from(this.files)
            .filter(
                file =>
                file.name
                .toLowerCase()
                .endsWith(".docx")
            );

        convertedFiles = [];

        convertBtn.disabled =
            selectedFiles.length === 0;

        downloadAllBtn.disabled = true;

        showFiles();

    }
);


/* SELECT AGAIN */

selectBtn.addEventListener(
    "click",
    function(){

        wordInput.click();

    }
);


/* DRAG */

upload.addEventListener(
    "dragover",
    function(e){

        e.preventDefault();

        upload.classList.add("drag");

    }
);


upload.addEventListener(
    "dragleave",
    function(){

        upload.classList.remove("drag");

    }
);


upload.addEventListener(
    "drop",
    function(e){

        e.preventDefault();

        upload.classList.remove("drag");

        selectedFiles =
            Array.from(
                e.dataTransfer.files
            )
            .filter(
                file =>
                file.name
                .toLowerCase()
                .endsWith(".docx")
            );

        convertedFiles = [];

        convertBtn.disabled =
            selectedFiles.length === 0;

        downloadAllBtn.disabled = true;

        showFiles();

    }
);


/* SHOW FILES */

function showFiles(){

    results.innerHTML = "";


    if(!selectedFiles.length){

        results.innerHTML =
        `<div class="empty">
            📂 Select Word files to begin
        </div>`;

        return;

    }


    selectedFiles.forEach(
        file=>{

            const card =
                document.createElement("div");

            card.className =
                "card";


            card.innerHTML = `

                <div class="card-head">

                    <div class="word-icon">
                        📝
                    </div>

                    <div class="filename">
                        ${safe(file.name)}
                    </div>

                </div>

                <div class="card-body">

                    <div class="row">

                        <span>
                            File Size
                        </span>

                        <span>
                            ${formatBytes(file.size)}
                        </span>

                    </div>

                    <div class="row">

                        <span>
                            Type
                        </span>

                        <span>
                            DOCX
                        </span>

                    </div>

                    <div class="row">

                        <span>
                            Status
                        </span>

                        <span>
                            ⏳ Ready
                        </span>

                    </div>

                </div>
            `;


            results.appendChild(card);

        }
    );

}


/* CONVERT */

convertBtn.addEventListener(
    "click",
    convertAll
);


async function convertAll(){

    if(!selectedFiles.length)
        return;


    convertedFiles = [];

    results.innerHTML = "";

    progressArea.style.display =
        "block";


    for(
        let i=0;
        i<selectedFiles.length;
        i++
    ){

        const file =
            selectedFiles[i];


        progressText.innerText =
            `Converting ${i+1} of ${selectedFiles.length}`;


        const percent =
            Math.round(
                i /
                selectedFiles.length *
                100
            );


        progressBar.style.width =
            percent + "%";


        progressPercent.innerText =
            percent + "%";


        try{

            const result =
                await convertWordToPDF(file);


            convertedFiles.push(result);


            addResult(
                result,
                convertedFiles.length - 1
            );

        }
        catch(error){

            console.error(error);

            addError(file);

        }


        await wait(150);

    }


    progressBar.style.width =
        "100%";

    progressPercent.innerText =
        "100%";

    progressText.innerText =
        "✅ Conversion Complete";


    downloadAllBtn.disabled =
        convertedFiles.length === 0;

}


/*
    WORD → PDF
*/

async function convertWordToPDF(file){

    const arrayBuffer =
        await file.arrayBuffer();


    /*
        Extract DOCX as HTML
    */

    const result =
        await mammoth.convertToHtml({
            arrayBuffer:
                arrayBuffer
        });


    const html =
        result.value;


    /*
        Temporary rendering area
    */

    const wrapper =
        document.createElement("div");


    wrapper.style.position =
        "absolute";

    wrapper.style.left =
        "-100000px";

    wrapper.style.top =
        "0";

    wrapper.style.width =
        "700px";

    wrapper.style.padding =
        "30px";

    wrapper.style.background =
        "white";

    wrapper.style.color =
        "black";

    wrapper.style.fontFamily =
        "Arial, sans-serif";

    wrapper.style.fontSize =
        document.getElementById(
            "fontSize"
        ).value + "px";


    wrapper.innerHTML =
        html;


    document.body.appendChild(
        wrapper
    );


    /*
        Page settings
    */

    const pageSize =
        document.getElementById(
            "pageSize"
        ).value;


    const orientation =
        document.getElementById(
            "orientation"
        ).value;


    const margin =
        Number(
            document.getElementById(
                "margin"
            ).value
        );


    /*
        Create PDF
    */

    const pdf =
        new jsPDF({

            orientation:
                orientation,

            unit:"mm",

            format:
                pageSize

        });


    /*
        PDF dimensions
    */

    const pageWidth =
        pdf.internal.pageSize.getWidth();

    const pageHeight =
        pdf.internal.pageSize.getHeight();


    /*
        Convert HTML to PDF
    */

    await pdf.html(
        wrapper,
        {

            x:margin,

            y:margin,

            width:
                pageWidth -
                margin * 2,

            windowWidth:700,

            autoPaging:
                "text",

            margin:[
                margin,
                margin,
                margin,
                margin
            ],

            html2canvas:{
                scale:1.5
            }

        }
    );


    document.body.removeChild(
        wrapper
    );


    /*
        Get PDF Blob
    */

    const blob =
        pdf.output("blob");


    const baseName =
        file.name
        .replace(
            /\.docx$/i,
            ""
        );


    return {

        blob:blob,

        name:
            baseName +
            ".pdf",

        original:
            file.name,

        size:
            blob.size

    };

}


/* RESULT CARD */

function addResult(
    item,
    index
){

    const card =
        document.createElement("div");

    card.className =
        "card";


    card.innerHTML = `

        <div class="card-head">

            <div class="word-icon">
                📕
            </div>

            <div class="filename">
                ${safe(item.name)}
            </div>

        </div>


        <div class="card-body">

            <div class="row">

                <span>
                    Source
                </span>

                <span>
                    ${safe(item.original)}
                </span>

            </div>


            <div class="row">

                <span>
                    PDF Size
                </span>

                <span>
                    ${formatBytes(item.size)}
                </span>

            </div>


            <div class="row">

                <span>
                    Format
                </span>

                <span>
                    PDF
                </span>

            </div>


            <div class="row">

                <span>
                    Status
                </span>

                <span class="status">
                    ✅ Converted
                </span>

            </div>


            <button
                class="success"
                onclick="downloadOne(${index})"
            >
                📥 DOWNLOAD PDF
            </button>

        </div>

    `;


    results.appendChild(card);

}


/* ERROR */

function addError(file){

    const card =
        document.createElement("div");

    card.className =
        "card";


    card.innerHTML = `

        <div class="card-head">

            <div class="word-icon">
                ⚠️
            </div>

            <div class="filename">
                ${safe(file.name)}
            </div>

        </div>

        <div class="card-body">

            <div class="row">

                <span>
                    Status
                </span>

                <span
                    style="color:#ff7b8c"
                >
                    ❌ Failed
                </span>

            </div>

            <div class="row">

                <span>
                    Note
                </span>

                <span>
                    DOCX required
                </span>

            </div>

        </div>

    `;


    results.appendChild(card);

}


/* DOWNLOAD ONE */

function downloadOne(index){

    const item =
        convertedFiles[index];

    if(!item)
        return;


    const url =
        URL.createObjectURL(
            item.blob
        );


    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        item.name;


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
        ()=>{
            URL.revokeObjectURL(url);
        },
        1000
    );

}


/* DOWNLOAD ALL */

downloadAllBtn.addEventListener(
    "click",
    function(){

        convertedFiles.forEach(
            (item,index)=>{

                setTimeout(
                    ()=>{
                        downloadOne(index);
                    },
                    index * 500
                );

            }
        );

    }
);


/* CLEAR */

clearBtn.addEventListener(
    "click",
    function(){

        selectedFiles = [];

        convertedFiles = [];

        wordInput.value = "";

        convertBtn.disabled = true;

        downloadAllBtn.disabled = true;

        progressArea.style.display =
            "none";

        progressBar.style.width =
            "0%";

        progressPercent.innerText =
            "0%";

        results.innerHTML =
        `<div class="empty">
            📂 Select Word files to begin
        </div>`;

    }
);


/* HELPERS */

function wait(ms){

    return new Promise(
        resolve =>
        setTimeout(resolve,ms)
    );

}


function formatBytes(bytes){

    if(bytes < 1024)
        return bytes + " B";

    if(bytes < 1024 * 1024)
        return (
            bytes / 1024
        ).toFixed(2) + " KB";

    return (
        bytes /
        (1024 * 1024)
    ).toFixed(2) + " MB";

}


function safe(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
