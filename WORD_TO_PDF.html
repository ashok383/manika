

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANIKARNIKA - Word to PDF Converter</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:25px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#e0f7fa,#ede7f6,#fff8e1);
    color:#263238;
}

.container{
    max-width:950px;
    margin:25px auto;
    background:white;
    padding:28px;
    border-radius:18px;
    box-shadow:0 8px 30px #0002;
    border:2px solid #00bfa5;
}

.header{
    text-align:center;
    padding-bottom:20px;
    border-bottom:2px solid #e0f2f1;
}

.header h1{
    color:#00897b;
    margin:8px 0;
}

.header p{color:#607d8b}

.upload-box{
    margin-top:25px;
    padding:35px 20px;
    text-align:center;
    border:2px dashed #00a99d;
    border-radius:14px;
    background:#e0f7fa;
}

.upload-box input{
    display:block;
    margin:18px auto 0;
    max-width:100%;
}

input[type="text"]{
    width:100%;
    padding:13px;
    margin-top:8px;
    border:1px solid #b0bec5;
    border-radius:8px;
    font-size:15px;
}

.field{margin-top:20px}

label{
    font-weight:bold;
    color:#37474f;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:22px;
}

button{
    flex:1;
    min-width:150px;
    padding:14px;
    border:0;
    border-radius:9px;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#00c9a7,#00796b);
    box-shadow:0 4px 12px #00897b33;
}

button:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:not-allowed}

.clear-btn{
    background:linear-gradient(135deg,#ff7043,#d84315);
}

#status{
    text-align:center;
    margin-top:20px;
    padding:13px;
    border-radius:8px;
    background:#f1f5f9;
    color:#455a64;
    font-weight:bold;
    overflow-wrap:anywhere;
}

#progress{
    width:100%;
    height:9px;
    margin-top:12px;
    border-radius:10px;
    background:#e0e0e0;
    overflow:hidden;
    display:none;
}

#progressBar{
    width:0%;
    height:100%;
    background:linear-gradient(90deg,#00c9a7,#ffca28);
    transition:width .2s;
}

.preview-heading{
    margin-top:30px;
    color:#00897b;
}

#documentPreview{
    min-height:200px;
    padding:35px;
    margin-top:15px;
    border:1px solid #cfd8dc;
    border-radius:8px;
    background:white;
    overflow-wrap:anywhere;
    color:#222;
    font-family:"Times New Roman",serif;
    font-size:12pt;
    line-height:1.5;
}

#documentPreview:empty:before{
    content:"Your Word document preview will appear here.";
    color:#90a4ae;
}

#documentPreview h1,
#documentPreview h2,
#documentPreview h3{
    color:#222;
    page-break-after:avoid;
}

#documentPreview table{
    border-collapse:collapse;
    width:100%;
    margin:12px 0;
    page-break-inside:auto;
}

#documentPreview td,
#documentPreview th{
    border:1px solid #777;
    padding:6px;
    vertical-align:top;
}

#documentPreview img{
    max-width:100%;
    height:auto;
}

#documentPreview p{
    margin:0 0 10px;
}

.footer{
    text-align:center;
    margin-top:25px;
    font-size:12px;
    color:#78909c;
}

@media(max-width:600px){
    body{padding:10px}
    .container{padding:17px}
    #documentPreview{padding:15px}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>📄 MANIKARNIKA</h1>
    <h2>WORD TO PDF CONVERTER</h2>
    <p>Convert Word documents into downloadable PDF files</p>
</div>

<div class="upload-box">
    <h3>📁 Select Word Document</h3>
    <p>Upload your .DOCX file</p>
    <input type="file" id="wordFile" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
</div>

<div class="field">
    <label>Output PDF File Name</label>
    <input type="text" id="fileName" placeholder="Enter PDF file name">
</div>

<div class="buttons">
    <button id="convertBtn" onclick="convertWord()">
        CONVERT TO PDF
    </button>

    <button id="downloadBtn" onclick="downloadPDF()" disabled>
        DOWNLOAD PDF
    </button>

    <button class="clear-btn" onclick="clearAll()">
        CLEAR
    </button>
</div>

<div id="progress">
    <div id="progressBar"></div>
</div>

<div id="status">Waiting for Word document...</div>

<h3 class="preview-heading">📑 DOCUMENT PREVIEW</h3>

<div id="documentPreview"></div>

<div class="footer">
    MANIKARNIKA DOCUMENT TOOLS | WORD TO PDF
</div>

</div>

<!-- Required libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.9.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"></script>

<script>

let converted = false;
let currentFileName = "Converted_Document.pdf";

const fileInput = document.getElementById("wordFile");
const preview = document.getElementById("documentPreview");
const statusBox = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");
const convertBtn = document.getElementById("convertBtn");

function setStatus(message){
    statusBox.textContent = message;
}

function setProgress(value){
    document.getElementById("progress").style.display = "block";
    document.getElementById("progressBar").style.width = value + "%";
}

function cleanFileName(name){
    return name
        .replace(/\.pdf$/i,"")
        .replace(/[\\/:*?"<>|]/g,"_")
        .trim() || "Converted_Document";
}

// Automatically suggest output filename
fileInput.addEventListener("change",function(){

    const file = this.files[0];

    converted = false;
    downloadBtn.disabled = true;
    preview.innerHTML = "";

    if(!file){
        setStatus("No file selected.");
        return;
    }

    if(!file.name.toLowerCase().endsWith(".docx")){
        this.value = "";
        setStatus("Please upload a valid .DOCX Word document.");
        return;
    }

    document.getElementById("fileName").value =
        file.name.replace(/\.docx$/i,"");

    setStatus("Word document selected: " + file.name);
});

// Convert DOCX into HTML preview
async function convertWord(){

    const file = fileInput.files[0];

    if(!file){
        setStatus("Please select a Word document first.");
        return;
    }

    if(!window.mammoth || !window.html2pdf || !window.DOMPurify){
        setStatus("Required libraries could not load. Check your internet connection.");
        return;
    }

    convertBtn.disabled = true;
    downloadBtn.disabled = true;
    converted = false;

    preview.innerHTML = "";
    setProgress(10);
    setStatus("Reading Word document...");

    try{

        const arrayBuffer = await file.arrayBuffer();

        setProgress(35);

        const result = await mammoth.convertToHtml(
            {arrayBuffer:arrayBuffer},
            {
                convertImage:mammoth.images.imgElement(function(image){
                    return image.read("base64").then(function(data){
                        return {
                            src:"data:" + image.contentType + ";base64," + data
                        };
                    });
                })
            }
        );

        if(!result.value || !result.value.trim()){
            throw new Error("No readable document content found.");
        }

        setProgress(65);

        // Sanitize converted HTML before preview
        const safeHTML = DOMPurify.sanitize(result.value,{
            USE_PROFILES:{html:true},
            ADD_DATA_URI_TAGS:["img"]
        });

        preview.innerHTML = safeHTML;

        // Check if document contains readable content
        if(!preview.textContent.trim() && !preview.querySelector("img")){
            throw new Error("The document contains no readable content.");
        }

        setProgress(100);

        converted = true;
        downloadBtn.disabled = false;

        setStatus("✓ Word document converted successfully. Preview is ready.");

        if(result.messages && result.messages.length){
            console.warn("Word conversion notices:",result.messages);
        }

    }catch(error){

        console.error(error);

        preview.innerHTML = "";
        converted = false;
        downloadBtn.disabled = true;

        setStatus("Conversion failed: " + error.message);

    }finally{

        convertBtn.disabled = false;

    }
}

// Generate and download PDF
async function downloadPDF(){
    send_15();

    if(!converted){
        setStatus("Please convert a Word document first.");
        return;
    }

    if(!window.html2pdf){
        setStatus("PDF library unavailable. Check your internet connection.");
        return;
    }

    downloadBtn.disabled = true;
    setStatus("Generating PDF. Please wait...");
    setProgress(20);

    try{

        const fileName = cleanFileName(
            document.getElementById("fileName").value
        );

        currentFileName = fileName + ".pdf";

        const options = {

            margin:[12,12,12,12],

            filename:currentFileName,

            image:{
                type:"jpeg",
                quality:0.98
            },

            html2canvas:{
                scale:2,
                useCORS:true,
                backgroundColor:"#ffffff",
                scrollY:0,
                logging:false
            },

            jsPDF:{
                unit:"mm",
                format:"a4",
                orientation:"portrait",
                compress:true
            },

            pagebreak:{
                mode:["css","legacy"],
                avoid:["tr","img"]
            }

        };

        setProgress(45);

        await html2pdf()
            .set(options)
            .from(preview)
            .save();

        setProgress(100);

        setStatus("✓ PDF downloaded successfully: " + currentFileName);

    }catch(error){

        console.error(error);

        setStatus("PDF generation failed: " + error.message);

    }finally{

        downloadBtn.disabled = false;

    }
}

// Clear everything
function clearAll(){

    fileInput.value = "";
    document.getElementById("fileName").value = "";

    preview.innerHTML = "";

    converted = false;
    downloadBtn.disabled = true;

    document.getElementById("progress").style.display = "none";
    document.getElementById("progressBar").style.width = "0%";

    setStatus("Waiting for Word document...");
}

</script>

<script>
    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey &&
            ["I", "J", "C"].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && e.key.toUpperCase() === "U")
        ) {
            e.preventDefault();
        }
    });
    </script>
<script src="database_script.js"></script>

</body>
</html>
