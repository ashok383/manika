

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>(MANIK_A_RNIKA) Query InputS Here 👇🏻</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef3f8;
    padding: 20px;
}

.container {
    max-width: 450px;
    margin: 50px auto;
    padding: 25px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 20px #0002;
}

h2 {
    color: #16845b;
}

textarea, button {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    box-sizing: border-box;
    border-radius: 7px;
    font-size: 15px;
}

textarea {
    border: 1px solid #ccc;
    min-height: 110px;
    resize: vertical;
}

button {
    background: linear-gradient(135deg, #16a36b, #087443);
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#status {
    font-size: 14px;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

    <h1>MANIKARNIKA_QUERY_BOX</h1>

    <p>👇🏻 Enter your Adiveces & Complaints 👇🏻</p>

    <textarea
        id="queryInput"
        placeholder="Type your suggestions and complaints here..."
    ></textarea>

    <button id="saveButton" onclick="saveQuery()">
        SEND || MAIL TO MANIKARNIKA
    </button>

    <p id="status">Ready to send.</p>

</div>

<script>

// 1. SUPABASE CONNECTION

const SUPABASE_URL ="https://rkykifprxauikmucqwaa.supabase.co";

const SUPABASE_KEY ="sb_publishable_3KfAGVBSTjO67XaXdvPuBQ_7doPuHST";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// 2. SAVE QUERY TO DATABASE

async function saveQuery() {

    const queryText = document
        .getElementById("queryInput")
        .value.trim();

    const button = document.getElementById("saveButton");
    const status = document.getElementById("status");

    if (!queryText) {
        status.textContent = "Please enter a query!";
        return;
    }

    button.disabled = true;
    status.textContent = "Saving to Supabase...";

    try {

        const { error } = await supabaseClient
            .from("demo_messages")
            .insert({
                message: queryText
            });

        if (error) throw error;

        document.getElementById("queryInput").value = "";

        status.textContent =
            "Query sent successfully to manikarnika!🦅";

    } catch (error) {

        status.textContent =
            "Database error: " + error.message;

    } finally {

        button.disabled = false;

    }
}

</script>
    <script>
    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey &&
            ["I", "J", "C"].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && e.key.toUpperCase() === "U")
        ) {
            e.preventDefault();
        }
    });
    </script>

</body>
</html>
