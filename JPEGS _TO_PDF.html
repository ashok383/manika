<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>MANIK-A-RNIKA | Multiple JPEG to PDF</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Segoe UI,sans-serif;
}

body{
  min-height:100vh;
  background:#f1f3f6;
  color:#202124;
  padding:15px;
}

.app{
  width:100%;
  max-width:600px;
  margin:auto;
}

.header{
  background:#fff;
  border-radius:22px;
  padding:20px;
  text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
  margin-bottom:15px;
}

.header h1{
  color:#1769e0;
  font-size:23px;
}

.header p{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.card{
  background:#fff;
  padding:18px;
  border-radius:22px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.drop{
  display:block;
  text-align:center;
  padding:35px 15px;
  border:2px dashed #4285f4;
  border-radius:18px;
  background:#f7faff;
  cursor:pointer;
  transition:.2s;
}

.drop.active{
  background:#e8f0fe;
  border-color:#0b57d0;
}

.drop-icon{
  font-size:42px;
}

.drop h3{
  margin-top:8px;
  font-size:17px;
}

.drop p{
  margin-top:5px;
  color:#777;
  font-size:12px;
}

input[type=file]{
  display:none;
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.setting{
  background:#f5f6f7;
  padding:12px;
  border-radius:15px;
}

.setting label{
  display:block;
  color:#666;
  font-size:12px;
  margin-bottom:6px;
}

.setting select{
  width:100%;
  border:0;
  outline:none;
  background:transparent;
  font-size:14px;
}

.image-list{
  margin-top:15px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.image-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  background:#f7f7f7;
  border-radius:14px;
}

.image-item img{
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:10px;
}

.number{
  width:28px;
  height:28px;
  border-radius:50%;
  background:#1769e0;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
}

.info{
  flex:1;
  min-width:0;
}

.info strong{
  display:block;
  font-size:13px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.info span{
  color:#777;
  font-size:11px;
}

.remove{
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#ffebee;
  color:#d32f2f;
  font-size:18px;
  cursor:pointer;
}

.btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:25px;
  margin-top:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.primary{
  background:#1769e0;
  color:#fff;
}

.clear{
  background:#e8f0fe;
  color:#1769e0;
}

.status{
  text-align:center;
  margin-top:10px;
  min-height:18px;
  color:#666;
  font-size:12px;
}

.empty{
  text-align:center;
  color:#999;
  padding:15px;
  font-size:13px;
}

.footer{
  text-align:center;
  margin-top:15px;
  color:#999;
  font-size:11px;
}

@media(max-width:400px){
  .settings{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<h1>📄 Multiple JPEG → PDF</h1>
<p>MANIK-A-RNIKA PDF Tools</p>
</div>

<div class="card">

<label class="drop" id="dropZone">

<div class="drop-icon">🖼️</div>

<h3>
Select Multiple JPEG Images
</h3>

<p>
JPG / JPEG / PNG<br>
Tap here or drag multiple images
</p>

<input
type="file"
id="fileInput"
accept="image/jpeg,image/jpg,image/png"
multiple
>

</label>


<div class="settings">

<div class="setting">

<label>PDF Page Size</label>

<select id="pageSize">

<option value="a4">
A4
</option>

<option value="letter">
Letter
</option>

<option value="image">
Original Image Size
</option>

</select>

</div>


<div class="setting">

<label>Image Quality</label>

<select id="quality">

<option value="1">
Maximum
</option>

<option value=".92">
High
</option>

<option value=".80">
Medium
</option>

</select>

</div>

</div>


<div
class="image-list"
id="imageList"
>

<div class="empty">
No images selected
</div>

</div>


<button
class="btn clear"
onclick="clearAll()"
>
🗑 Clear All
</button>


<button
class="btn primary"
id="convertBtn"
onclick="createPDF()"
>
⬇ Create One PDF
</button>


<div
class="status"
id="status"
></div>

</div>


<div class="footer">
© 2026 MANIK-A-RNIKA
</div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


<script>

const fileInput =
document.getElementById("fileInput");

const dropZone =
document.getElementById("dropZone");

const imageList =
document.getElementById("imageList");

const status =
document.getElementById("status");

let images = [];


/* ======================================
   FILE SELECT
====================================== */

fileInput.addEventListener(
"change",
function(){

addImages(
Array.from(this.files)
);

this.value = "";

});


/* ======================================
   DRAG OVER
====================================== */

dropZone.addEventListener(
"dragover",
function(e){

e.preventDefault();

dropZone.classList.add(
"active"
);

});


/* ======================================
   DRAG LEAVE
====================================== */

dropZone.addEventListener(
"dragleave",
function(){

dropZone.classList.remove(
"active"
);

});


/* ======================================
   DROP
====================================== */

dropZone.addEventListener(
"drop",
function(e){

e.preventDefault();

dropZone.classList.remove(
"active"
);

addImages(
Array.from(
e.dataTransfer.files
)
);

});


/* ======================================
   ADD IMAGES
====================================== */

function addImages(files){

const valid =
files.filter(file =>

file.type === "image/jpeg" ||
file.type === "image/jpg" ||
file.type === "image/png"

);


/*
 Prevent duplicate files
*/

valid.forEach(file => {

const duplicate =
images.some(
old =>
old.name === file.name &&
old.size === file.size
);

if(!duplicate){
images.push(file);
}

});


renderImages();

}


/* ======================================
   RENDER IMAGE LIST
====================================== */

function renderImages(){

imageList.innerHTML = "";


if(images.length === 0){

imageList.innerHTML =
'<div class="empty">No images selected</div>';

return;

}


images.forEach(
(file,index) => {

const item =
document.createElement("div");

item.className =
"image-item";


/* Number */

const number =
document.createElement("div");

number.className =
"number";

number.textContent =
index + 1;


/* Preview */

const img =
document.createElement("img");

img.src =
URL.createObjectURL(file);


/* Info */

const info =
document.createElement("div");

info.className =
"info";


const name =
document.createElement("strong");

name.textContent =
file.name;


const size =
document.createElement("span");

size.textContent =
formatSize(file.size);


info.appendChild(name);
info.appendChild(size);


/* Remove */

const remove =
document.createElement("button");

remove.className =
"remove";

remove.textContent =
"×";

remove.onclick =
function(){

images.splice(
index,
1
);

renderImages();

};


item.appendChild(number);
item.appendChild(img);
item.appendChild(info);
item.appendChild(remove);

imageList.appendChild(item);

});

}


/* ======================================
   FILE SIZE
====================================== */

function formatSize(bytes){

if(bytes < 1024)
return bytes + " B";

if(bytes < 1024*1024)
return (
bytes/1024
).toFixed(1)+" KB";

return (
bytes/(1024*1024)
).toFixed(1)+" MB";

}


/* ======================================
   LOAD IMAGE
====================================== */

function loadImage(file){

return new Promise(
(resolve,reject)=>{

const img =
new Image();

img.onload =
()=>resolve(img);

img.onerror =
reject;

img.src =
URL.createObjectURL(file);

});

}


/* ======================================
   CREATE PDF
====================================== */

async function createPDF(){

if(images.length === 0){

alert(
"Please select multiple JPEG images first."
);

return;

}


const button =
document.getElementById(
"convertBtn"
);


button.disabled =
true;

button.textContent =
"⏳ Creating PDF...";


try{

const {
jsPDF
} = window.jspdf;


const pageSize =
document.getElementById(
"pageSize"
).value;


const quality =
parseFloat(
document.getElementById(
"quality"
).value
);


let pdf;


/*
 Create initial PDF
*/

if(pageSize === "letter"){

pdf =
new jsPDF({
orientation:"portrait",
unit:"mm",
format:"letter"
});

}

else if(pageSize === "image"){

const first =
await loadImage(
images[0]
);

const widthMM =
first.width *
25.4 / 96;

const heightMM =
first.height *
25.4 / 96;

pdf =
new jsPDF({
orientation:
widthMM > heightMM
? "landscape"
: "portrait",

unit:"mm",

format:[
widthMM,
heightMM
]
});

}

else{

pdf =
new jsPDF({
orientation:"portrait",
unit:"mm",
format:"a4"
});

}


/*
 Process every image
*/

for(
let i=0;
i<images.length;
i++
){

status.textContent =
`Processing image ${i+1} of ${images.length}...`;


const img =
await loadImage(
images[i]
);


/*
 Add page after first image
*/

if(i > 0){

if(pageSize === "letter"){

pdf.addPage(
"letter",
"portrait"
);

}

else if(pageSize === "image"){

const widthMM =
img.width *
25.4 / 96;

const heightMM =
img.height *
25.4 / 96;

pdf.addPage(
[
widthMM,
heightMM
],
widthMM > heightMM
? "landscape"
: "portrait"
);

}

else{

pdf.addPage(
"a4",
"portrait"
);

}

}


/*
 Page dimensions
*/

const pageWidth =
pdf.internal.pageSize.getWidth();

const pageHeight =
pdf.internal.pageSize.getHeight();


/*
 Original image size
*/

if(pageSize === "image"){

pdf.addImage(
img,
"JPEG",
0,
0,
pageWidth,
pageHeight,
undefined,
"FAST"
);

continue;

}


/*
 A4 / Letter
*/

const margin = 8;

const maxWidth =
pageWidth -
margin * 2;

const maxHeight =
pageHeight -
margin * 2;


/*
 Keep original aspect ratio
*/

const ratio =
Math.min(
maxWidth / img.width,
maxHeight / img.height
);


const width =
img.width * ratio;

const height =
img.height * ratio;


/*
 Center image
*/

const x =
(pageWidth - width) / 2;

const y =
(pageHeight - height) / 2;


/*
 Canvas for JPEG quality
*/

const canvas =
document.createElement(
"canvas"
);

canvas.width =
img.naturalWidth;

canvas.height =
img.naturalHeight;


const ctx =
canvas.getContext("2d");


ctx.fillStyle =
"#ffffff";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


ctx.drawImage(
img,
0,
0
);


const jpeg =
canvas.toDataURL(
"image/jpeg",
quality
);


/*
 Add image to PDF
*/

pdf.addImage(
jpeg,
"JPEG",
x,
y,
width,
height,
undefined,
"FAST"
);

}


/*
 Download
*/

status.textContent =
"✅ PDF created successfully";


pdf.save(
"MANIK-A-RNIKA_Multiple_Images.pdf"
);

}
catch(error){

console.error(error);

status.textContent =
"❌ PDF creation failed.";

alert(
"Something went wrong while creating the PDF."
);

}


button.disabled =
false;

button.textContent =
"⬇ Create One PDF";

}


/* ======================================
   CLEAR
====================================== */

function clearAll(){

images = [];

renderImages();

status.textContent = "";

}

</script>

</body>
</html>
