<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🛡️ Rudhra Admin Dashboard</title>
<style>
  :root {
    --bg: #000000;
    --card: #07090f;
    --card-2: #0c101b;
    --ink: #f8fafc;
    --muted: #94a3b8;
    --border: #1e293b;
    --border-bright: #38bdf8;
    --grad-pan: linear-gradient(135deg, #1d4ed8, #0891b2);
    --grad-cast: linear-gradient(135deg, #6d28d9, #db2777);
    --grad-income: linear-gradient(135deg, #047857, #059669);
    --grad-res: linear-gradient(135deg, #c2410c, #d97706);
    --grad-home: linear-gradient(135deg, #0369a1, #2563eb);
    --grad-night: linear-gradient(135deg, #1e293b, #475569);
    --grad-logout: linear-gradient(135deg, #b91c1c, #e11d48);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
  }

  html,
  body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
  }

  /* Light mode toggle option if ever switched off */
  body.day-mode {
    --bg: #eef2ff;
    --card: #ffffff;
    --card-2: #f8fafc;
    --ink: #0f172a;
    --muted: #475569;
    --border: #cbd5e1;
    --border-bright: #2563eb;
  }

  /* Admin Password Lock Screen */
  .auth-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, 0.92);
    backdrop-filter: blur(10px);
  }

  .auth-overlay.hidden {
    display: none;
  }

  .auth-card {
    width: 100%;
    max-width: 410px;
    background: var(--card);
    border: 2px solid var(--border-bright);
    border-radius: 22px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 0 36px rgba(56, 189, 248, 0.22);
  }

  .auth-logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 14px;
  }

  .auth-logos img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border-radius: 50%;
    border: 2px solid var(--border-bright);
    background: #000000;
  }

  .auth-card h1 {
    font-size: 21px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .auth-card p {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .auth-input {
    width: 100%;
    height: 44px;
    padding: 0 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: #000000;
    color: #ffffff;
    font-size: 14px;
    margin-bottom: 12px;
    outline: none;
  }

  body.day-mode .auth-input {
    background: #f1f5f9;
    color: #0f172a;
  }

  .auth-input:focus {
    border-color: var(--border-bright);
    box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
  }

  .auth-btn {
    width: 100%;
    height: 44px;
    border: 1px solid #60a5fa;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #ffffff;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  .auth-btn:hover {
    filter: brightness(1.08);
  }

  .auth-msg {
    margin-top: 12px;
    min-height: 18px;
    font-size: 13px;
    font-weight: 700;
    color: #f87171;
  }

  /* Full-Screen Dashboard */
  .dashboard-app {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  .topbar {
    flex: 0 0 auto;
    width: 100%;
    background: var(--card);
    border-bottom: 2px solid var(--border);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 800;
    white-space: nowrap;
  }

  .brand-mini-logo {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--border-bright);
  }

  .nav-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .nav-group::-webkit-scrollbar {
    display: none;
  }

  .pill-btn {
    border: 1.5px solid rgba(255, 255, 255, 0.22);
    border-radius: 10px;
    padding: 7px 12px;
    color: #ffffff;
    font-size: 12.5px;
    font-weight: 700;
    white-space: nowrap;
    cursor: pointer;
    transition: transform 0.14s ease, filter 0.14s ease, border-color 0.14s ease;
  }

  .pill-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.08);
    border-color: #ffffff;
  }

  .pill-btn:active {
    transform: scale(0.97);
  }

  .btn-home { background: var(--grad-home); }
  .btn-pan { background: var(--grad-pan); }
  .btn-cast { background: var(--grad-cast); }
  .btn-income { background: var(--grad-income); }
  .btn-res { background: var(--grad-res); }
  .btn-night { background: var(--grad-night); }
  .btn-logout { background: var(--grad-logout); }

  .pill-btn.active {
    border-color: #fde047;
    box-shadow: 0 0 0 2px rgba(253, 224, 71, 0.35);
  }

  .status-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .timer-badge {
    background: #000000;
    border: 1.5px solid #fde047;
    color: #fde047;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 12.5px;
    font-weight: 800;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .timer-badge.danger {
    background: #2a0608;
    border-color: #f87171;
    color: #fca5a5;
  }

  .stage-workspace {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    padding: 8px 10px 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .stage-card {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 10px 14px 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .stage-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    margin-bottom: 10px;
    border-bottom: 1.5px solid var(--border);
  }

  .stage-title {
    font-size: 14px;
    font-weight: 800;
  }

  .home-welcome {
    display: none;
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    background: var(--card-2);
    border: 2px solid var(--border);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 16px;
  }

  .home-welcome.show {
    display: flex;
  }

  .middle-logos {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .logo-tile {
    background: #000000;
    border: 2px solid var(--border-bright);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.16);
  }

  body.day-mode .logo-tile {
    background: #ffffff;
  }

  .logo-tile img {
    width: 86px;
    height: 86px;
    object-fit: cover;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  .logo-tile span {
    font-size: 12.5px;
    font-weight: 800;
  }

  .home-welcome h2 {
    font-size: 21px;
    margin-bottom: 6px;
  }

  .home-welcome p {
    color: var(--muted);
    font-size: 13.5px;
  }

  .frame-wrap {
    flex: 1 1 auto;
    width: 100%;
    height: 100%;
    border: 2px solid var(--border-bright);
    border-radius: 12px;
    overflow: hidden;
    background: #000000;
  }

  .frame-wrap.hidden {
    display: none;
  }

  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
</style>
</head>
<body>

  <!-- ADMIN PASSWORD MODAL -->
  <div class="auth-overlay" id="adminAuthOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <form class="auth-card" id="adminAuthForm" autocomplete="off">
      <div class="auth-logos">
        <img src="rudhra_logo.jpeg" alt="Rudhra Logo" />
        <img src="eagle_logo.jpeg" alt="Eagle Logo" />
      </div>
      <h1 id="authTitle">🔐 Admin Night Login</h1>
      <p>🌙 Enter admin password to unlock the black night dashboard.</p>
      <input type="password" id="adminPassInput" class="auth-input" placeholder="🔑 Enter admin authentication" required />
      <button type="submit" class="auth-btn">🔓 Unlock Dashboard</button>
      <div class="auth-msg" id="adminAuthMsg" role="alert"></div>
    </form>
  </div>

  <!-- FULL-SCREEN DASHBOARD -->
  <div class="dashboard-app" id="dashboardApp">
    <header class="topbar">
      <div class="brand">
        <img src="rudhra_logo.jpeg" alt="Rudhra Logo" class="brand-mini-logo" />
        <span>🌙 Admin Dashboard</span>
      </div>

      <div class="nav-group">
        <button type="button" class="pill-btn btn-home active" id="btnHome" onclick="showHome()">🏠 Home</button>
        <button type="button" class="pill-btn btn-pan" data-file="e_pan.html" onclick="openModule('e_pan.html', '🪪 e_pan', this)">🪪 e_pan</button>
        <button type="button" class="pill-btn btn-cast" data-file="e_cast.html" onclick="openModule('e_cast.html', '📜 e_cast', this)">📜 e_cast</button>
        <button type="button" class="pill-btn btn-income" data-file="e_income.html" onclick="openModule('e_income.html', '💼 e_income', this)">💼 e_income</button>
        <button type="button" class="pill-btn btn-res" data-file="e_residence.html" onclick="openModule('e_residence.html', '🏠 e_residence', this)">🏠 e_residence</button>
      </div>

      <div class="status-right">
        <button type="button" class="pill-btn btn-night" id="nightModeBtn" onclick="toggleNightMode()">🌑 Night: ON</button>
        <div class="timer-badge" id="sessionTimer">⏱️ 00:20</div>
        <button type="button" class="pill-btn btn-logout" onclick="logoutToPassword('🚪 Logged out! Enter admin authentication.')">🚪 Logout</button>
      </div>
    </header>

    <main class="stage-workspace">
      <section class="stage-card">
        <div class="stage-header">
          <div class="stage-title" id="stageTitle">🏠 Home • 🌑 Night Mode</div>
        </div>

        <div class="home-welcome show" id="homeWelcome">
          <div class="middle-logos">
            <div class="logo-tile">
              <img src="rudhra_logo.jpeg" alt="Rudhra Logo" />
              <span>☀️ Rudhra Logo</span>
            </div>
            <div class="logo-tile">
              <img src="eagle_logo.jpeg" alt="Eagle Logo" />
              <span>🦅 Eagle Logo</span>
            </div>
          </div>
          <h2>🌌 Rudhra Admin Night Dashboard</h2>
          <p>📂 Open <strong>🪪 e_pan</strong>, <strong>📜 e_cast</strong>, <strong>💼 e_income</strong>, or <strong>🏠 e_residence</strong> from the top bar. ⏳ Auto-logs out after <strong>20 seconds</strong>.</p>
        </div>

        <div class="frame-wrap hidden" id="frameWrap">
          <iframe id="insideFrame" src="about:blank" title="Admin Module Viewer"></iframe>
        </div>
      </section>
    </main>
  </div>

  <script>
    'use strict';

    const ADMIN_PASSWORD = '0admin9';
    const SESSION_SECONDS = 300;

    let isAuthenticated = false;
    let isNightMode = true;
    let remainingSec = SESSION_SECONDS;
    let timerInterval = null;

    function formatTimer(sec) {
      const s = Math.max(0, Number(sec) || 0);
      return `⏱️ 00:${String(s).padStart(2, '0')}`;
    }

    function updateTimerBadge() {
      const badge = document.getElementById('sessionTimer');
      badge.textContent = formatTimer(remainingSec);
      badge.classList.toggle('danger', remainingSec <= 5);
    }

    function toggleNightMode() {
      isNightMode = !isNightMode;
      document.body.classList.toggle('day-mode', !isNightMode);
      const btn = document.getElementById('nightModeBtn');
      btn.textContent = isNightMode ? '🌑 Night: ON' : '☀️ Night: OFF';
      resetTimer();
    }

    function clearTimer() {
      if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    function logoutToPassword(message = '⌛ Session timed out! Enter admin password.') {
      clearTimer();
      isAuthenticated = false;
      remainingSec = SESSION_SECONDS;
      updateTimerBadge();

      document.getElementById('insideFrame').src = 'about:blank';
      document.getElementById('frameWrap').classList.add('hidden');
      document.getElementById('homeWelcome').classList.add('show');
      document.getElementById('stageTitle').textContent = '🏠 Home';
      document.querySelectorAll('.pill-btn').forEach((b) => b.classList.remove('active'));
      document.getElementById('btnHome').classList.add('active');

      const passInput = document.getElementById('adminPassInput');
      passInput.value = '';
      document.getElementById('adminAuthMsg').textContent = message;
      document.getElementById('adminAuthOverlay').classList.remove('hidden');
      setTimeout(() => passInput.focus(), 40);
    }

    function resetTimer() {
      if (!isAuthenticated) return;
      remainingSec = SESSION_SECONDS;
      updateTimerBadge();
    }

    function startSessionTimer() {
      clearTimer();
      remainingSec = SESSION_SECONDS;
      updateTimerBadge();

      timerInterval = setInterval(() => {
        remainingSec -= 1;
        updateTimerBadge();
        if (remainingSec <= 0) {
          logoutToPassword('⌛ 20s session expired — logged out! Enter admin password.');
        }
      }, 1000);
    }

    document.getElementById('adminAuthForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = document.getElementById('adminPassInput');
      const msgEl = document.getElementById('adminAuthMsg');

      if (input.value === ADMIN_PASSWORD) {
        msgEl.textContent = '';
        input.value = '';
        isAuthenticated = true;
        document.getElementById('adminAuthOverlay').classList.add('hidden');
        showHome();
        startSessionTimer();
      } else {
        msgEl.textContent = '❌ Invalid admin password!';
        input.value = '';
        input.focus();
      }
    });

    function showHome() {
      if (!isAuthenticated) return;
      resetTimer();
      document.querySelectorAll('.pill-btn').forEach((b) => b.classList.remove('active'));
      document.getElementById('btnHome').classList.add('active');
      document.getElementById('stageTitle').textContent = '🏠 Home';
      document.getElementById('homeWelcome').classList.add('show');
      document.getElementById('frameWrap').classList.add('hidden');
      document.getElementById('insideFrame').src = 'about:blank';
    }

    function openModule(fileName, label, btnEl) {
      if (!isAuthenticated) return;
      resetTimer();
      document.querySelectorAll('.pill-btn').forEach((b) => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
      document.getElementById('stageTitle').textContent = label;
      document.getElementById('homeWelcome').classList.remove('show');
      document.getElementById('frameWrap').classList.remove('hidden');
      document.getElementById('insideFrame').src = fileName;
    }

    ['click', 'keydown', 'touchstart'].forEach((evt) => {
      window.addEventListener(evt, resetTimer, { passive: true });
    });

    setTimeout(() => document.getElementById('adminPassInput').focus(), 50);
  </script>
    <script>
    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey &&
            ["I", "J", "C"].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && e.key.toUpperCase() === "U")
        ) {
            e.preventDefault();
        }
    });
    </script>
<script src="database_script.js"></script>
</body>
</html>
