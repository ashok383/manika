
<!DOCTYPE html>
<html>
<head>
    <title>Auto Tab Close</title>
</head>
<body style="text-align:center;font-family:Arial">

    <h2>Automatic Tab Closing</h2>
    <h1 id="timer">10</h1>
    <p>This tab will close in 10 seconds.</p>

    <script>
        let time = 10;

        const countdown = setInterval(() => {
            time--;
            document.getElementById("timer").innerText = time;

            if (time <= 0) {
                clearInterval(countdown);
                window.close();
            }
        }, 1000);
    </script>

</body>
</html>
