<!DOCTYPE html>
<html>
<head>
    <title>WhatsApp Message Button</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 100px; background: #f0f0f0; }
        button { background: #25D366; color: white; border: none; padding: 15px 30px; font-size: 18px; border-radius: 50px; cursor: pointer; }
        button:hover { background: #128C7E; }
        input { padding: 10px; width: 250px; margin: 10px; border-radius: 5px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h2>Send WhatsApp Message</h2>
    
    <input type="text" id="phone" placeholder="Enter WhatsApp Number with country code" value="9951912096">
    <br>
    <input type="text" id="msg" placeholder="Enter Your Message" value="Hello, I need help!">
    <br><br>
    
    <button onclick="sendWhatsApp()">💬 Send on WhatsApp</button>

    <script>
        function sendWhatsApp() {
            const number = document.getElementById("phone").value;
            const message = document.getElementById("msg").value;

            if (!number) { alert("Enter number!"); return; }

            const link = `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
            window.open(link, "_blank");
        }
    </script>

</body>
</html>
