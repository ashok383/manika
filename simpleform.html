<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manika - PDF Tools</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;padding:20px;max-width:900px;margin:auto}
.card{background:#1e293b;padding:20px;border-radius:16px;margin-bottom:20px;border:1px solid #334155}
h2{color:#38bdf8} input,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:none}
input{background:#0f172a;color:#fff;border:1px solid #334155}
button{background:#38bdf8;color:#000;font-weight:700;cursor:pointer}
.log{background:#000;padding:12px;border-radius:8px;margin-top:10px;white-space:pre-wrap;font-size:13px;color:#22c55e;max-height:300px;overflow:auto}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700}
.ok{background:#22c55e;color:#000} .fail{background:#ef4444}
</style>
</head>
<body>
<h1 style="text-align:center">MANIKA PDF Tools - ashok383.github.io/manika</h1>

<!-- TOOL 1: UNLOCK PDF -->
<div class="card">
<h2>1. Unlock PDF (With Password)</h2>
<p style="font-size:13px;color:#94a3b8">Password unna PDF ni unlock chesi fresh PDF istundi. Password crack cheyadu.</p>
<input type="file" id="pdfFile" accept="application/pdf">
<input type="password" id="pdfPass" placeholder="Enter PDF Password">
<button onclick="unlockPDF()">Unlock & Download</button>
<div id="log1" class="log">Waiting...</div>
</div>

<!-- TOOL 2: E-SIGNATURE VERIFIER -->
<div class="card">
<h2>2. Digital E-Signature Verifier</h2>
<input type="file" id="sigFile" accept="application/pdf">
<button onclick="verifySignature()">Verify Signature</button>
<div id="log2" class="log">Upload PDF to check digital signature...</div>
</div>

<script>
const { PDFDocument } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

async function unlockPDF(){
  const log = document.getElementById('log1');
  const file = document.getElementById('pdfFile').files[0];
  const pass = document.getElementById('pdfPass').value;
  if(!file){ log.textContent='Please select PDF'; return; }
  if(!pass){ log.textContent='Please enter password'; return; }
  try{
    log.textContent='Reading PDF...';
    const buffer = await file.arrayBuffer();
    // Try to load with password using pdf-lib (pdf-lib needs password in load options)
    let pdfDoc;
    try {
      pdfDoc = await PDFDocument.load(buffer, { password: pass, ignoreEncryption: false });
    } catch(e){
      // Fallback for pdf.js encrypted check
      log.textContent='Invalid password or file is not password protected.\nError: '+e.message;
      return;
    }
    log.textContent='Password correct! Removing encryption...';
    // Re-save without encryption = unlocked
    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'unlocked_'+file.name;
    a.click();
    log.textContent='SUCCESS: Unlocked PDF Downloaded!\nFile: unlocked_'+file.name+'\nThanks to ManikarNika!';
  }catch(err){
    log.textContent='FAILED: '+err.message;
  }
}

async function verifySignature(){
  const log = document.getElementById('log2');
  const file = document.getElementById('sigFile').files[0];
  if(!file){ log.textContent='Please select PDF'; return; }
  try{
    log.textContent='Analyzing PDF...';
    const buffer = await file.arrayBuffer();
    const text = new TextDecoder('latin1').decode(buffer);

    const hasAcroForm = text.includes('/AcroForm');
    const hasSig = text.includes('/Type /Sig') || text.includes('/SubFilter');
    const byteRange = text.match(/\/ByteRange\s*\[\s*(\d+\s+\d+\s+\d+\s+\d+)\s*\]/);
    const subFilter = (text.match(/\/SubFilter\s*\/([A-Za-z0-9\.]+)/)||[])[1] || 'N/A';
    const signer = (text.match(/\/Name\s*\(([^)]+)\)/)||[])[1] || (text.match(/\/CN=([^\/\),]+)/)||[])[1] || 'Unknown';
    const reason = (text.match(/\/Reason\s*\(([^)]+)\)/)||[])[1] || 'N/A';
    const sigCount = (text.match(/\/Type\s*\/Sig/g) || []).length;

    // Use pdf.js to check if file is valid
    await pdfjsLib.getDocument({data: buffer}).promise;

    let result = '';
    if(sigCount > 0 && hasSig){
      result += `✅ DIGITAL SIGNATURE FOUND\n`;
      result += `------------------------\n`;
      result += `Signature Count: ${sigCount}\n`;
      result += `Signer: ${signer}\n`;
      result += `SubFilter (Type): ${subFilter}\n`;
      result += `Reason: ${reason}\n`;
      result += `ByteRange: ${byteRange ? byteRange[1] : 'Present'}\n`;
      result += `AcroForm: ${hasAcroForm ? 'Yes' : 'No'}\n\n`;
      result += `Status: ${byteRange ? '🟢 Document appears digitally signed. Integrity protected.' : '🟡 Signature object found but ByteRange incomplete.'}\n\n`;
      result += `Note: Full cryptographic validation (PKI chain) needs server-side verification. This tool confirms presence & structure.`;
      log.innerHTML = `<span class="badge ok">VERIFIED</span>\n`+result;
    } else {
      result += `❌ NO DIGITAL SIGNATURE FOUND\n`;
      result += `------------------------\n`;
      result += `This PDF does NOT contain a digital e-signature.\n`;
      result += `It may have only an image signature, not PKI based.\n`;
      log.innerHTML = `<span class="badge fail">NOT SIGNED</span>\n`+result;
    }
    log.textContent = log.innerText + '\n\nThanks to ManikarNika! 👍';

  }catch(err){
    log.textContent='Error verifying: '+err.message;
  }
}
</script>
</body>
</html>
