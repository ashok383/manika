
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase Database Tester</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    padding: 20px;
}
.container {
    max-width: 550px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #0002;
}
h2 { color: #16865c; text-align: center; }
input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
}
button {
    width: 100%;
    padding: 12px;
    margin: 6px 0;
    border: none;
    border-radius: 6px;
    background: #16865c;
    color: white;
    font-size: 15px;
    cursor: pointer;
}
button:hover { background: #106b48; }
#status {
    padding: 12px;
    margin-top: 12px;
    background: #eee;
    border-radius: 6px;
    overflow-wrap: anywhere;
}
li {
    padding: 9px;
    border-bottom: 1px solid #ddd;
    overflow-wrap: anywhere;
}
</style>
</head>

<body>

<div class="container">

<h2>Supabase Database Tester</h2>

<label>Enter Message</label>
<input id="message" placeholder="Type a test message">

<button onclick="testConnection()">1. Test Connection</button>

<button onclick="saveData()">2. Insert Data</button>

<button onclick="readData()">3. Read Database</button>

<div id="status">Waiting for connection...</div>

<h3>Database Records</h3>
<ul id="records"></ul>

</div>

<script>

// YOUR SUPABASE DETAILS
const SUPABASE_URL = "https://hecozzzeasnefcrpgjrt.supabase.co/rest/v1/";

const SUPABASE_KEY = "sb_publishable_vsp39BuZDOugE0l0zvabrA_fTxgyoG5";

// CREATE CONNECTION
const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

function status(message, error = false) {
    const box = document.getElementById("status");
    box.textContent = message;
    box.style.color = error ? "red" : "green";
}

// 1. TEST CONNECTION
async function testConnection() {

    if (SUPABASE_URL.includes("YOUR_PROJECT") ||
        SUPABASE_KEY.includes("YOUR_")) {
        status("Please enter your Supabase URL and key.", true);
        return;
    }

    status("Testing connection...");

    const { data, error } = await db
        .from("test_messages")
        .select("id")
        .limit(1);

    if (error) {
        status("Connection failed: " + error.message, true);
        return;
    }

    status("SUCCESS! Supabase database connected.");
}

// 2. INSERT DATA
async function saveData() {

    const message = document.getElementById("message").value.trim();

    if (!message) {
        status("Please enter a message.", true);
        return;
    }

    status("Saving data...");

    const { error } = await db
        .from("test_messages")
        .insert([{ message: message }]);

    if (error) {
        status("Insert failed: " + error.message, true);
        return;
    }

    document.getElementById("message").value = "";

    status("SUCCESS! Data inserted.");

    await readData();
}

// 3. READ DATA
async function readData() {

    status("Reading database...");

    const { data, error } = await db
        .from("test_messages")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(50);

    if (error) {
        status("Read failed: " + error.message, true);
        return;
    }

    const records = document.getElementById("records");
    records.replaceChildren();

    data.forEach(row => {

        const li = document.createElement("li");

        li.textContent =
            "ID: " + row.id +
            " | Message: " + row.message +
            " | Date: " + new Date(row.created_at).toLocaleString();

        records.appendChild(li);

    });

    status("SUCCESS! " + data.length + " records loaded.");
}

</script>

</body>
</html>
