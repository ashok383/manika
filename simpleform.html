<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANIK_A_RNIKA - Twilio SMS Tester</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 space-y-5">
        
        <!-- Header -->
        <div class="flex items-center gap-3 border-b border-slate-800 pb-4">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-lg">
                <i class="fa-solid fa-paper-plane"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight text-white">Twilio SMS Test Portal</h1>
                <p class="text-xs text-slate-400">MANIK_A_RNIKA Backend API Tester</p>
            </div>
        </div>

        <!-- Form Inputs -->
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Twilio Account SID:</label>
                <input type="text" id="accountSid" placeholder="ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Twilio Auth Token:</label>
                <input type="password" id="authToken" placeholder="Your Auth Token" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">From Twilio Number (E.164):</label>
                <input type="text" id="fromNumber" placeholder="+1234567890" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Recipient Mobile Number (E.164):</label>
                <input type="text" id="toNumber" placeholder="+919876543210" 
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 font-mono">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Message Text:</label>
                <textarea id="messageBody" rows="2" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500">Test message from MANIK_A_RNIKA platform.</textarea>
            </div>
        </div>

        <!-- Submit Button -->
        <button onclick="sendTwilioSms()" id="sendBtn" 
            class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold text-xs rounded-lg transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20">
            <i class="fa-solid fa-paper-plane"></i> Send Test SMS
        </button>

        <!-- Status Log -->
        <div id="statusBox" class="hidden p-3 rounded-lg border text-xs font-mono break-all"></div>

    </div>

    <script>
        async function sendTwilioSms() {
            const sid = document.getElementById('accountSid').value.trim();
            const token = document.getElementById('authToken').value.trim();
            const from = document.getElementById('fromNumber').value.trim();
            const to = document.getElementById('toNumber').value.trim();
            const body = document.getElementById('messageBody').value.trim();

            const statusBox = document.getElementById('statusBox');
            const sendBtn = document.getElementById('sendBtn');

            if (!sid || !token || !from || !to || !body) {
                showStatus("⚠️ Please fill in all fields before sending.", "yellow");
                return;
            }

            statusBox.classList.remove('hidden');
            statusBox.className = "p-3 rounded-lg border text-xs font-mono break-all bg-slate-800 border-slate-700 text-slate-300";
            statusBox.innerHTML = "⏳ Connecting to Twilio REST API...";
            sendBtn.disabled = true;

            // Twilio API Endpoint
            const endpoint = `https://api.twilio.com/2010-04-01/Accounts/${sid}/Messages.json`;

            // Prepare HTTP Basic Auth header
            const credentials = btoa(`${sid}:${token}`);

            // Prepare Form Data payload
            const formData = new URLSearchParams();
            formData.append('From', from);
            formData.append('To', to);
            formData.append('Body', body);

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Basic ${credentials}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                });

                const data = await response.json();

                if (response.ok) {
                    showStatus(`✅ Success! Message SID: ${data.sid}<br>Status: ${data.status}`, "green");
                } else {
                    showStatus(`❌ Error (${data.code || response.status}): ${data.message}`, "red");
                }
            } catch (err) {
                showStatus(`❌ Network Error: Direct browser API calls might be blocked by CORS or network restrictions.<br>Details: ${err.message}`, "red");
            } finally {
                sendBtn.disabled = false;
            }
        }

        function showStatus(msg, color) {
            const statusBox = document.getElementById('statusBox');
            statusBox.classList.remove('hidden');

            if (color === "green") {
                statusBox.className = "p-3 rounded-lg border text-xs font-mono break-all bg-emerald-950/60 border-emerald-800 text-emerald-300";
            } else if (color === "red") {
                statusBox.className = "p-3 rounded-lg border text-xs font-mono break-all bg-rose-950/60 border-rose-800 text-rose-300";
            } else {
                statusBox.className = "p-3 rounded-lg border text-xs font-mono break-all bg-amber-950/60 border-amber-800 text-amber-300";
            }

            statusBox.innerHTML = msg;
        }
    </script>
</body>
</html>
