
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase Message Test</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body {
    font-family: Arial;
    background: #eef3f8;
    padding: 25px;
}
.container {
    max-width: 450px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 15px #ccc;
}
textarea, button {
    width: 100%;
    padding: 12px;
    margin-top: 12px;
    box-sizing: border-box;
}
button {
    background: #16845b;
    color: white;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
}
#messageBox {
    background: #eef8f2;
    padding: 15px;
    margin-top: 15px;
    border-radius: 8px;
    overflow-wrap: anywhere;
}
#status {
    color: #16845b;
}
</style>
</head>

<body>

<div class="container">

<h2>Supabase Test</h2>
<p>Send and read one message</p>

<textarea id="message" placeholder="Enter your message"></textarea>

<button onclick="saveMessage()">SEND MESSAGE</button>

<button onclick="readMessage()">READ LATEST MESSAGE</button>

<p id="status">Connecting...</p>

<div id="messageBox">No message loaded.</div>

</div>

<script>

// SUPABASE CONNECTION
const SUPABASE_URL = "https://hecozzzeasnefcrpgjrt.supabase.co";
const SUPABASE_KEY = "sb_publishable_vsp39BuZDOugE0l0zvabrA_fTxgyoG5";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// SAVE MESSAGE
async function saveMessage() {

    const message = document.getElementById("message").value.trim();
    const status = document.getElementById("status");

    if (!message) {
        status.textContent = "Please enter a message.";
        return;
    }

    status.textContent = "Sending...";

    try {

        const { error } = await db
            .from("demo_messages")
            .insert({ message: message });

        if (error) throw error;

        document.getElementById("message").value = "";

        status.textContent = "Message sent successfully!";

        await readMessage();

    } catch (error) {
        status.textContent = "Error: " + error.message;
    }
}

// READ ONLY THE LATEST MESSAGE
async function readMessage() {

    const status = document.getElementById("status");
    const box = document.getElementById("messageBox");

    status.textContent = "Loading message...";

    try {

        const { data, error } = await db
            .from("demo_messages")
            .select("message,created_at")
            .order("created_at", { ascending: false })
            .limit(1)
            .maybeSingle();

        if (error) throw error;

        if (!data) {
            box.textContent = "No messages found.";
            status.textContent = "Database is connected.";
            return;
        }

        box.replaceChildren();

        const msg = document.createElement("p");
        msg.textContent = data.message;

        const date = document.createElement("small");
        date.textContent = new Date(data.created_at).toLocaleString();

        box.append(msg, date);

        status.textContent = "Latest message loaded.";

    } catch (error) {
        status.textContent = "Read error: " + error.message;
    }
}

// LOAD MESSAGE ON PAGE OPEN
readMessage();

</script>

</body>
</html>
