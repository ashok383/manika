<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTP Sender - MANIK_A_RNIKA</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f6f7fb; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 320px; }
        h2 { font-size: 18px; color: #2563eb; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #e5e7eb; border-radius: 10px; outline: none; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        #status { margin-top: 10px; font-size: 12px; color: #555; text-align: center; }
    </style>
</head>
<body>

<div class="box">
    <h2>Mobile Verification</h2>
    <input type="text" id="mobile" placeholder="Enter Mobile (e.g. +917680078196)">
    <button onclick="sendOTP()">Send OTP</button>
    <p id="status"></p>
</div>

<script>
    async function sendOTP() {
        const mobile = document.getElementById('mobile').value.trim();
        const statusEl = document.getElementById('status');
        if (!mobile) { statusEl.innerText = "Please enter a mobile number."; return; }

        statusEl.innerText = "Sending...";

        try {
            const response = await fetch('http://localhost:3000/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mobile })
            });
            const data = await response.json();
            if (response.ok) {
                statusEl.style.color = "green";
                statusEl.innerText = data.message;
            } else {
                statusEl.style.color = "red";
                statusEl.innerText = "Error: " + data.message;
            }
        } catch (err) {
            statusEl.style.color = "red";
            statusEl.innerText = "Network Error: Make sure your Node.js backend is running!";
        }
    }
</script>

</body>
</html>
