<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{--bg:#f4f6fc;--surface:#fff;--primary:#6558e8;--text:#182039;--border:#e2e7f0}
*{box-sizing:border-box}
body{margin:0;padding:20px;color:var(--text);background:radial-gradient(ellipse at top left,#e7e6ff,transparent 42%),var(--bg);font-family:'Inter',sans-serif}
.container{max-width:960px;margin:22px auto;padding:24px;background:#fff;border-radius:24px;box-shadow:0 24px 70px rgba(28,37,75,.09)}
.container h4{margin:0 0 28px;padding-bottom:22px;text-align:center;font-size:28px;font-weight:800;color:var(--primary);border-bottom:1px solid var(--border)}
label{display:block;margin:18px 0 7px;font-size:13px;font-weight:700}
input:not([type="radio"]):not([type="checkbox"]):not([type="file"]),textarea{width:100%;padding:12px 14px;border:1px solid #dce2ee;border-radius:10px;margin-bottom:12px}
input[type="file"]{width:100%;padding:12px;background:#f8f8ff;border:1px dashed #aaa4ef;border-radius:12px;margin-bottom:12px}
button{padding:12px 18px;border-radius:10px;font-weight:700;cursor:pointer;border:1px solid transparent;margin:6px 5px 6px 0}
.add-btn{color:var(--primary);background:#efedff} .remove-btn{color:#c43248;background:#fff0f2}
.preview-btn{color:white;background:linear-gradient(135deg,#7868f4,#5141d0)}
.download-btn{color:#fff;background:linear-gradient(135deg,#00d2ff,#0097a7);border:none;padding:14px 28px;position:relative;overflow:hidden}
.download-btn::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(120deg,transparent,rgba(255,255,255,0.5),transparent);animation:shine 2.5s infinite}
@keyframes shine{0%{left:-100%}100%{left:100%}}
.academicRow{display:flex;gap:5px;padding:12px;background:#f8f9fd;border:1px solid var(--border);border-radius:12px;margin-bottom:8px}
</style>
</head>
<body>
<div class="container">
<h4>🌸🌿(RESUME_BUILDER)🌿🌸</h4>

<label>Upload Photo</label><input type="file" id="photo" accept="image/*">
<label>Full Name</label><input id="fullName" value="Your Fullname">
<label>Father Name</label><input id="fatherName" value="FATHER_NAME">
<label>Mother Name</label><input id="motherName" value="MOTHER_NAME">
<label>Date of Birth</label><input id="dob" type="date">
<label>Email</label><input id="email" value="yourname@email.com">
<label>Phone</label><input id="phone" value="+91 9XXXXXXXXX">
<label>Address</label><textarea id="address">Hyderabad, Telangana, India</textarea>
<label>Career Objective</label><textarea id="objective">A highly motivated individual seeking a challenging position.</textarea>
<label>Professional Summary</label><textarea id="summary">Enthusiastic professional with strong foundation in modern technologies.</textarea>

<label>Academic Details</label>
<div id="academicsContainer">
    <div class="academicRow"><input value="B,Tech or B,Sc"><input value="University"><input value="2026 - 2027"><input value="8.5 CGPA"><button class="remove-btn" onclick="removeAcademic(this)">✖</button></div>
</div>
<button class="add-btn" onclick="addAcademic()">➕ Add Academic</button>

<label>Education</label><textarea id="education">Bachelor of Technology in Computer</textarea>
<label>Experience</label><textarea id="experience">Fresher / Internship</textarea>
<label>Technical Skills</label><input id="skill" value="Your skills">
<label>Projects</label><textarea id="projects">Resume Builder, E-commerce Website</textarea>
<label>Habits / Strengths</label><textarea id="habits">Quick learner, disciplined, team player</textarea>
<label>Languages Known</label><input id="Languages" value="Hindi, English,Telugu,">
<label>Declaration</label><textarea id="declaration">I hereby declare that the information furnished above is true and correct.</textarea>
<label>Place</label><input id="place" value="Hyderabad">
<label>Date</label><input id="date" type="date">
<label>Signature</label><input id="signature" value="(manikhanta)">

<label>🌍 Select Resume Model</label>
<div style="padding:15px; border:2px dashed #7c4dff; border-radius:12px; background:#f9f9ff">
  <label><input type="radio" name="resumeModel" value="ats" checked><b>1. ATS-Friendly</b></label><br><br>
  <label><input type="radio" name="resumeModel" value="reverse"><b>2. Reverse-Chronological</b></label><br><br>
  <label><input type="radio" name="resumeModel" value="hybrid"><b>3. Hybrid</b></label><br><br>
  <label><input type="radio" name="resumeModel" value="onepage"><b>4. One-Page Resume</b></label><br><br>
  <label><input type="radio" name="resumeModel" value="targeted"><b>5. Targeted Resume</b></label><br><br>
  <label><input type="radio" name="resumeModel" value="functional"><b>6. Functional</b></label><br><br>
  <label><input type="radio" name="resumeModel" value="executive"><b>7. Executive Resume</b></label><br><br>
  <label><input type="radio" name="resumeModel" value="academic"><b>8. Academic CV</b></label><br><br>
  <label><input type="radio" name="resumeModel" value="creative"><b>9. Creative Resume</b></label><br><br>
  <label><input type="radio" name="resumeModel" value="europass"><b>10. Europass CV</b></label>
</div>

<div style="margin-top:15px;">
    <button class="preview-btn" onclick="previewCV()">👁 Preview</button>
    <button class="download-btn" onclick="payAndDownload()">💳 PAY & DOWNLOAD YOUR RESUME PDF</button>
</div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

<script>
function addAcademic(){
    const d=document.createElement("div");
    d.className="academicRow";
    d.innerHTML=`<input placeholder="Course"><input placeholder="Institute"><input placeholder="Year"><input placeholder="GPA"><button class="remove-btn" onclick="removeAcademic(this)">✖</button>`;
    document.getElementById("academicsContainer").appendChild(d);
}
function removeAcademic(btn){btn.parentElement.remove();}
function getSelectedResumeModel(){
    const el=document.querySelector('input[name="resumeModel"]:checked');
    return el ? el.value : 'ats';
}
function previewCV(){
    const photoInput=document.getElementById("photo");
    const f=photoInput.files[0];
    if(f){const r=new FileReader();r.onload=e=>openPreview(e.target.result);r.readAsDataURL(f);}
    else openPreview("");
}
function openPreview(photoSrc){
    const gv=id=>document.getElementById(id)?.value||'';
    const w=window.open("","_blank","width=900,height=1200");
    w.document.write(`<h1>${gv("fullName")}</h1><p>Model: ${getSelectedResumeModel()}</p><p>${gv("email")} | ${gv("phone")}</p><button onclick="window.print()">Print</button>`);
    w.document.close();
}
</script>

<!-- PAY FUNCTION IS ONLY IN THIS FILE -->
<script src="script.js"></script>

</body>
</html>
