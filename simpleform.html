<!DOCTYPE html>
<html>
<head>
    <title>MANIKARNIKA Auto Close</title>
</head>
<body style="font-family:Arial;text-align:center;padding:40px">

    <h2>Automatic Tab Closing</h2>
    <h1 id="timer" style="font-size:60px">10</h1>
    <p>Closing automatically in 10 seconds...</p>

    <script>
        let seconds = 10;

        const timer = setInterval(() => {
            seconds--;
            document.getElementById("timer").textContent = seconds;

            if (seconds <= 0) {
                clearInterval(timer);
                window.close();

                document.body.innerHTML =
                    "<h2>Browser blocked automatic closing.</h2>";
            }
        }, 1000);
    </script>

</body>
</html>
