<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Send OTP Example</title>
</head>
<body>

    <div style="max-width: 300px; margin: 50px auto; font-family: Arial;">
        <h2>Mobile Verification</h2>
        <input type="text" id="mobile" placeholder="Enter Mobile Number (e.g., +91...)" style="width: 100%; padding: 8px; margin-bottom: 10px;">
        <button onclick="sendOTP()" style="width: 100%; padding: 8px; background: #2563eb; color: white; border: none; cursor: pointer;">Send OTP</button>
        <p id="status" style="margin-top: 10px; font-size: 13px; color: #555;"></p>
    </div>

    <script>
        async function sendOTP() {
            const mobile = document.getElementById('mobile').value;
            const statusEl = document.getElementById('status');

            if (!mobile) {
                statusEl.innerText = "Please enter a valid mobile number.";
                return;
            }

            statusEl.innerText = "Sending OTP...";

            try {
                // Call your backend server endpoint
                const response = await fetch('https://your-backend-server.com/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mobile: mobile })
                });

                const data = await response.json();
                if (response.ok) {
                    statusEl.innerText = "OTP sent successfully!";
                } else {
                    statusEl.innerText = "Error: " + data.message;
                }
            } catch (error) {
                statusEl.innerText = "Network error. Please try again.";
            }
        }
    </script>
</body>
</html>
