<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #1e1e2f, #2a2a4a, #16213e);
      color: #ffffff;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 40px 35px;
      border-radius: 16px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .login-card h2 {
      font-size: 26px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .login-card p {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 28px;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 45px 14px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .input-group input::placeholder {
      color: #94a3b8;
    }

    .input-group input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #cbd5e1;
      cursor: pointer;
      font-size: 13px;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #0ea5e9, #6366f1);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    .login-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      color: #f87171;
      font-size: 13px;
      margin-top: 14px;
      min-height: 18px;
    }

    .shake {
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-6px); }
    }
  </style>
</head>
<body>

  <div class="login-card" id="loginCard">
    <h2>Access Portal</h2>
    <p>Enter your assigned password to continue</p>

    <form id="loginForm">
      <div class="input-group">
        <input 
          type="password" 
          id="passwordInput" 
          placeholder="Enter password..." 
          required 
          autocomplete="off"
        />
        <button type="button" class="toggle-password" id="toggleBtn">Show</button>
      </div>
      <button type="submit" class="login-btn">Unlock</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

  <script>
    // Map each password to its specific destination HTML file or URL
    const passwordRoutes = {
      "admin123": "admin-dashboard.html",
      "client2026": "client-portal.html",
      "vip999": "https://example.com/vip-page.html"
    };

    const form = document.getElementById("loginForm");
    const passwordInput = document.getElementById("passwordInput");
    const errorMsg = document.getElementById("errorMsg");
    const loginCard = document.getElementById("loginCard");
    const toggleBtn = document.getElementById("toggleBtn");

    // Toggle show/hide password
    toggleBtn.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      toggleBtn.textContent = isPassword ? "Hide" : "Show";
    });

    // Handle form submission
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const enteredPassword = passwordInput.value.trim();

      if (passwordRoutes[enteredPassword]) {
        errorMsg.textContent = "";
        window.location.href = passwordRoutes[enteredPassword];
      } else {
        errorMsg.textContent = "Invalid password. Please try again.";
        loginCard.classList.remove("shake");
        void loginCard.offsetWidth; // Trigger reflow to restart animation
        loginCard.classList.add("shake");
        passwordInput.value = "";
      }
    });
  </script>
<script>
    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey &&
            ["I", "J", "C"].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && e.key.toUpperCase() === "U")
        ) {
            e.preventDefault();
        }
    });
    </script>
</body>
</html>
