
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supabase Query Box Board</title>

<!-- Load Supabase JS v2 SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f4f8;
        padding: 20px;
        color: #1e293b;
    }

    .container {
        max-width: 500px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }

    h2 { margin-top: 0; color: #0f172a; }

    input, textarea, button {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        box-sizing: border-box;
        border-radius: 6px;
        font-size: 0.95rem;
    }

    textarea, input {
        border: 1px solid #cbd5e1;
        outline: none;
    }

    textarea:focus, input:focus {
        border-color: #16845b;
        box-shadow: 0 0 0 3px rgba(22, 132, 91, 0.15);
    }

    textarea {
        resize: vertical;
        min-height: 70px;
    }

    button {
        background: #16845b;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
    }

    button:hover { background: #126a48; }

    .btn-query {
        background: #2563eb;
    }
    .btn-query:hover { background: #1d4ed8; }

    .btn-delete {
        background: #dc2626;
        margin-top: 6px;
        padding: 6px 10px;
        font-size: 0.8rem;
        width: auto;
    }
    .btn-delete:hover { background: #b91c1c; }

    .record {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 12px;
        margin-top: 10px;
        border-radius: 8px;
        word-break: break-word;
    }

    .record p {
        margin: 0 0 4px 0;
        font-size: 0.95rem;
    }

    .record small {
        color: #64748b;
        font-size: 0.75rem;
        display: block;
        margin-bottom: 6px;
    }

    #status {
        font-size: 0.85rem;
        font-weight: 600;
        color: #16845b;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="container">

    <h2>Supabase Query Board</h2>
    <p>Insert messages and query your database.</p>

    <!-- WRITE / INSERT SECTION -->
    <textarea id="messageInput" placeholder="Type message to save..."></textarea>
    <button type="button" id="saveButton" onclick="saveMessage()">SAVE TO DATABASE</button>

    <hr style="border:0; border-top:1px solid #e2e8f0; margin: 20px 0;">

    <!-- QUERY / SEARCH SECTION -->
    <h3>Query Database</h3>
    <input type="text" id="queryInput" placeholder="Search message text...">
    <button type="button" class="btn-query" onclick="queryMessages()">RUN QUERY / SEARCH</button>

    <p id="status">Ready...</p>

    <hr style="border:0; border-top:1px solid #e2e8f0; margin: 20px 0;">

    <!-- READ / DISPLAY SECTION -->
    <h3>Database Records</h3>
    <button type="button" class="btn-query" onclick="fetchMessages()">REFRESH ALL</button>
    
    <div id="recordsContainer"></div>

</div>

<script>
    // 1. SUPABASE PROJECT DETAILS
    const SUPABASE_URL = "https://rkykifprxauikmucqwaa.supabase.co";
    const SUPABASE_KEY = "sb_publishable_3KfAGVBSTjO67XaXdvPuBQ_7doPuHST";

    // 2. INITIALIZE SUPABASE CLIENT
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const statusEl = document.getElementById("status");
    const recordsContainer = document.getElementById("recordsContainer");

    // 3. SAVE CUSTOM MESSAGE FROM TEXTAREA
    async function saveMessage() {
        const messageText = document.getElementById("messageInput").value.trim();
        const saveButton = document.getElementById("saveButton");

        if (!messageText) {
            statusEl.textContent = "Please enter a message to save!";
            return;
        }

        saveButton.disabled = true;
        statusEl.textContent = "Saving message...";

        try {
            const { error } = await supabaseClient
                .from("demo_messages")
                .insert([{ message: messageText }]);

            if (error) throw error;

            document.getElementById("messageInput").value = "";
            statusEl.textContent = "Message saved successfully!";
            fetchMessages();

        } catch (err) {
            statusEl.textContent = "Error: " + err.message;
        } finally {
            saveButton.disabled = false;
        }
    }

    // 4. QUERY / SEARCH MESSAGES
    async function queryMessages() {
        const queryText = document.getElementById("queryInput").value.trim();
        statusEl.textContent = "Querying database...";

        try {
            let query = supabaseClient
                .from("demo_messages")
                .select("id, message, created_at")
                .order("created_at", { ascending: false });

            // If text is entered in query box, filter results using .ilike()
            if (queryText) {
                query = query.ilike("message", `%${queryText}%`);
            }

            const { data, error } = await query;

            if (error) throw error;

            renderRecords(data);
            statusEl.textContent = `Query returned ${data.length} record(s).`;

        } catch (err) {
            statusEl.textContent = "Query error: " + err.message;
        }
    }

    // 5. DELETE PARTICULAR RECORD BY ID
    async function deleteRecord(id) {
        if (!confirm(`Are you sure you want to delete record #${id}?`)) return;

        statusEl.textContent = `Deleting record #${id}...`;

        try {
            const { error } = await supabaseClient
                .from("demo_messages")
                .delete()
                .eq("id", id);

            if (error) throw error;

            statusEl.textContent = `Record #${id} deleted successfully!`;
            fetchMessages();

        } catch (err) {
            statusEl.textContent = "Delete error: " + err.message;
        }
    }

    // 6. FETCH ALL MESSAGES
    async function fetchMessages() {
        document.getElementById("queryInput").value = "";
        statusEl.textContent = "Fetching records...";

        try {
            const { data, error } = await supabaseClient
                .from("demo_messages")
                .select("id, message, created_at")
                .order("created_at", { ascending: false });

            if (error) throw error;

            renderRecords(data);
            statusEl.textContent = `${data.length} record(s) loaded successfully.`;

        } catch (err) {
            statusEl.textContent = "Read error: " + err.message;
        }
    }

    // 7. HELPER TO RENDER RECORDS HTML
    function renderRecords(data) {
        recordsContainer.innerHTML = "";

        if (!data || data.length === 0) {
            recordsContainer.innerHTML = "<div class='record'><small>No records found.</small></div>";
            return;
        }

        data.forEach(item => {
            const card = document.createElement("div");
            card.className = "record";

            const idSmall = document.createElement("small");
            idSmall.innerHTML = `<b>ID:</b> ${item.id} | 🕒 ${new Date(item.created_at).toLocaleString()}`;

            const msgP = document.createElement("p");
            msgP.textContent = item.message;

            const delBtn = document.createElement("button");
            delBtn.className = "btn-delete";
            delBtn.textContent = "Delete This Record";
            delBtn.onclick = () => deleteRecord(item.id);

            card.appendChild(idSmall);
            card.appendChild(msgP);
            card.appendChild(delBtn);
            recordsContainer.appendChild(card);
        });
    }

    // Initial load when page opens
    fetchMessages();
</script>
<script>
    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey &&
            ["I", "J", "C"].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && e.key.toUpperCase() === "U")
        ) {
            e.preventDefault();
        }
    });
    </script>
</body>
</html>
