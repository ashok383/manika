
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eagle Admin | Supabase Super Log</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #10b981;
      --primary-hover: #059669;
      --accent: #3b82f6;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --border: #e2e8f0;
      --terminal-bg: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 20px;
      line-height: 1.5;
    }

    /* ==================== AUTHENTICATION SCREEN ==================== */
    #authOverlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #authOverlay.unlocked {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .auth-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      color: #f8fafc;
    }

    .eagle-emblem {
      width: 84px;
      height: 84px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(245, 158, 11, 0.35);
      border: 3px solid rgba(255, 255, 255, 0.15);
    }

    .eagle-emblem svg {
      width: 48px;
      height: 48px;
      fill: #ffffff;
    }

    .auth-card h2 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 6px;
      color: #ffffff;
    }

    .auth-card p {
      font-size: 0.88rem;
      color: #94a3b8;
      margin-bottom: 26px;
    }

    .auth-input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .auth-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #ffffff;
      font-size: 1rem;
      text-align: center;
      letter-spacing: 0.12em;
      transition: all 0.2s ease;
    }

    .auth-input:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25);
    }

    .auth-input.shake {
      animation: shake 0.4s ease;
      border-color: #ef4444;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
    }

    .btn-unlock {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      justify-content: center;
    }

    .btn-unlock:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35);
    }

    .auth-error {
      color: #f87171;
      font-size: 0.84rem;
      margin-top: 12px;
      min-height: 20px;
      font-weight: 500;
    }

    /* ==================== MAIN DASHBOARD ==================== */
    .dashboard-grid {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(15, 23, 42, 0.06);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    /* Header Section */
    .header {
      padding: 22px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      background: linear-gradient(to right, #ffffff, #f8fafc);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-eagle {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
    }

    .header-eagle svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .header h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      background: #dbeafe;
      color: #1d4ed8;
      font-size: 0.8rem;
      padding: 4px 12px;
      border-radius: 999px;
      font-weight: 600;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Toolbar: Search & Actions */
    .toolbar {
      padding: 16px 28px;
      background-color: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .search-wrapper {
      position: relative;
      flex: 1;
      min-width: 240px;
      max-width: 400px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 10px 36px 10px 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      color: var(--text-main);
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 2px 6px;
      display: none;
    }

    .clear-search:hover {
      color: var(--text-main);
    }

    /* Action Buttons */
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 16px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      box-shadow: 0 2px 6px rgba(16, 185, 129, 0.25);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-refresh {
      background-color: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-refresh:hover {
      background-color: #f1f5f9;
    }

    .btn-lock {
      background-color: #1e293b;
      color: #f8fafc;
    }

    .btn-lock:hover {
      background-color: #0f172a;
    }

    .btn-delete {
      background-color: #fee2e2;
      color: var(--danger);
      padding: 6px 12px;
      font-size: 0.82rem;
    }

    .btn-delete:hover {
      background-color: var(--danger);
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Table View */
    .table-wrapper {
      overflow-x: auto;
      max-height: 450px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background-color: #f8fafc;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      z-index: 1;
    }

    td {
      padding: 15px 24px;
      border-bottom: 1px solid var(--border);
      font-size: 0.94rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: #f8fafc;
    }

    .id-col {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text-muted);
      font-weight: 600;
      width: 90px;
    }

    .time-col {
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .action-col {
      text-align: right;
      width: 120px;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }

    mark {
      background-color: #fef08a;
      color: #854d0e;
      padding: 1px 3px;
      border-radius: 3px;
    }

    /* Super Log Console */
    .super-log-card {
      background: var(--terminal-bg);
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, 0.15);
      overflow: hidden;
      border: 1px solid #1e293b;
    }

    .log-header {
      background: #1e293b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .log-title {
      color: #f8fafc;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .btn-clear-log {
      background: #334155;
      color: #cbd5e1;
      padding: 4px 10px;
      font-size: 0.75rem;
      border-radius: 6px;
    }

    .btn-clear-log:hover {
      background: #475569;
      color: #ffffff;
    }

    .log-body {
      padding: 16px 20px;
      max-height: 220px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.83rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-entry {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      line-height: 1.4;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.06);
      padding-bottom: 5px;
    }

    .log-time {
      color: #64748b;
      white-space: nowrap;
    }

    .log-tag {
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .tag-info { background: rgba(56, 189, 248, 0.15); color: #38bdf8; }
    .tag-success { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .tag-warn { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .tag-error { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    .log-msg {
      color: #e2e8f0;
      word-break: break-word;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.3s ease;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- ==================== EAGLE AUTHENTICATION GATE ==================== -->
  <div id="authOverlay">
    <div class="auth-card">
      <div class="eagle-emblem">
        <!-- Custom Eagle Emblem SVG -->
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <path d="M32 6C24.5 6 19 10.5 17 17.5C12 18.5 6 22 4 28C9.5 27 14 27.5 17.5 29.5C15.5 34.5 16.5 41 21 46L17 56L26 51.5C28 52 30 52.3 32 52.3C34 52.3 36 52 38 51.5L47 56L43 46C47.5 41 48.5 34.5 46.5 29.5C50 27.5 54.5 27 60 28C58 22 52 18.5 47 17.5C45 10.5 39.5 6 32 6ZM26 21C27.7 21 29 22.3 29 24C29 25.7 27.7 27 26 27C24.3 27 23 25.7 23 24C23 22.3 24.3 21 26 21ZM38 21C39.7 21 41 22.3 41 24C41 25.7 39.7 27 38 27C36.3 27 35 25.7 35 24C35 22.3 36.3 21 38 21ZM32 29C35.5 29 38.5 31.8 38.5 35.5C38.5 37.5 37.2 39 35.5 39C34.2 39 33.2 38 32 38C30.8 38 29.8 39 28.5 39C26.8 39 25.5 37.5 25.5 35.5C25.5 31.8 28.5 29 32 29Z"/>
        </svg>
      </div>
      <h2>Eagle Command</h2>
      <p>Enter security access key to unlock database terminal</p>
      
      <form onsubmit="verifyAccessKey(event)">
        <div class="auth-input-group">
          <input 
            type="password" 
            id="accessKeyInput" 
            class="auth-input" 
            placeholder="••••••••" 
            autocomplete="off"
            autofocus
          >
        </div>
        <button type="submit" class="btn-unlock">🦅 Unlock Admin Panel</button>
      </form>
      <div class="auth-error" id="authError"></div>
    </div>
  </div>

  <!-- ==================== PROTECTED ADMIN DASHBOARD ==================== -->
  <div class="dashboard-grid" id="mainDashboard" style="display: none;">
    <!-- Main Admin Card -->
    <div class="card">
      <div class="header">
        <div class="title-group">
          <div class="header-eagle" title="Eagle Security Active">
            <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
              <path d="M32 6C24.5 6 19 10.5 17 17.5C12 18.5 6 22 4 28C9.5 27 14 27.5 17.5 29.5C15.5 34.5 16.5 41 21 46L17 56L26 51.5C28 52 30 52.3 32 52.3C34 52.3 36 52 38 51.5L47 56L43 46C47.5 41 48.5 34.5 46.5 29.5C50 27.5 54.5 27 60 28C58 22 52 18.5 47 17.5C45 10.5 39.5 6 32 6ZM26 21C27.7 21 29 22.3 29 24C29 25.7 27.7 27 26 27C24.3 27 23 25.7 23 24C23 22.3 24.3 21 26 21ZM38 21C39.7 21 41 22.3 41 24C41 25.7 39.7 27 38 27C36.3 27 35 25.7 35 24C35 22.3 36.3 21 38 21ZM32 29C35.5 29 38.5 31.8 38.5 35.5C38.5 37.5 37.2 39 35.5 39C34.2 39 33.2 38 32 38C30.8 38 29.8 39 28.5 39C26.8 39 25.5 37.5 25.5 35.5C25.5 31.8 28.5 29 32 29Z"/>
            </svg>
          </div>
          <div>
            <h1>
              Eagle Messages Admin
              <span class="live-dot" title="Connected to Supabase"></span>
            </h1>
          </div>
          <span class="badge" id="recordCount">0 records</span>
        </div>
        <div class="actions">
          <button class="btn-refresh" onclick="readMessages()">↻ Refresh</button>
          <button class="btn-primary" id="sendBtn" onclick="sendMessage()">+ Send "hello2333999w rudhra"</button>
          <button class="btn-lock" onclick="lockDashboard()" title="Lock Panel">🔒 Lock</button>
        </div>
      </div>

      <!-- Search Bar Toolbar -->
      <div class="toolbar">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input 
            type="text" 
            id="searchInput" 
            class="search-input" 
            placeholder="Search by ID, message content, or date..." 
            oninput="handleSearch()"
          >
          <button id="clearSearchBtn" class="clear-search" onclick="clearSearch()" title="Clear search">✕</button>
        </div>
        <div style="font-size: 0.85rem; color: var(--text-muted);" id="filterStatus">
          Showing all records
        </div>
      </div>

      <!-- Data Table -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="id-col">ID</th>
              <th>Message Content</th>
              <th>Created At</th>
              <th class="action-col">Action</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="4" class="empty-state">Loading database records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Super Log Activity Console -->
    <div class="super-log-card">
      <div class="log-header">
        <div class="log-title">
          <span>🦅</span> EAGLE SUPER LOG — SYSTEM ACTIVITY & TELEMETRY
        </div>
        <button class="btn-clear-log" onclick="clearSuperLog()">Clear Log</button>
      </div>
      <div class="log-body" id="superLogBody"></div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const client = supabase.createClient(
      'https://rkykifprxauikmucqwaa.supabase.co',
      'sb_publishable_3KfAGVBSTjO67XaXdvPuBQ_7doPuHST'
    );

    const SECRET_KEY = 'admin143';
    let allMessages = [];
    let isInitialized = false;

    // Check if already authenticated in this browser session
    if (sessionStorage.getItem('eagle_auth') === 'true') {
      grantAccess(false);
    }

    // Verify Password Key
    function verifyAccessKey(event) {
      event.preventDefault();
      const input = document.getElementById('accessKeyInput');
      const errorEl = document.getElementById('authError');

      if (input.value === SECRET_KEY) {
        sessionStorage.setItem('eagle_auth', 'true');
        errorEl.textContent = '';
        input.value = '';
        grantAccess(true);
      } else {
        errorEl.textContent = 'Access Denied: Invalid Eagle Security Key.';
        input.classList.remove('shake');
        void input.offsetWidth; // trigger reflow for animation
        input.classList.add('shake');
        input.value = '';
        input.focus();
      }
    }

    // Unlock Dashboard
    function grantAccess(isFreshLogin) {
      document.getElementById('authOverlay').classList.add('unlocked');
      document.getElementById('mainDashboard').style.display = 'flex';
      
      if (!isInitialized) {
        isInitialized = true;
        addSuperLog('SUCCESS', isFreshLogin ? 'Eagle Security Key verified. Admin session unlocked.' : 'Active Eagle session restored.');
        readMessages();
      }
    }

    // Lock Dashboard
    function lockDashboard() {
      sessionStorage.removeItem('eagle_auth');
      document.getElementById('authOverlay').classList.remove('unlocked');
      document.getElementById('mainDashboard').style.display = 'none';
      document.getElementById('accessKeyInput').focus();
      addSuperLog('WARN', 'Admin session manually locked.');
    }

    // Super Log Engine
    function addSuperLog(type, message) {
      const logBody = document.getElementById('superLogBody');
      const now = new Date();
      const timestamp = now.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }) + '.' + String(now.getMilliseconds()).padStart(3, '0');
      
      const tagClass = {
        'INFO': 'tag-info',
        'SUCCESS': 'tag-success',
        'WARN': 'tag-warn',
        'ERROR': 'tag-error'
      }[type] || 'tag-info';

      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `
        <span class="log-time">[${timestamp}]</span>
        <span class="log-tag ${tagClass}">${type}</span>
        <span class="log-msg">${escapeHTML(message)}</span>
      `;
      logBody.prepend(entry);
    }

    function clearSuperLog() {
      document.getElementById('superLogBody').innerHTML = '';
      addSuperLog('INFO', 'Super Log cleared by Eagle Admin.');
    }

    // Helper for subtle status notifications
    function showToast(msg, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = isError ? '#dc2626' : '#0f172a';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // 1. Send message
    async function sendMessage() {
      const btn = document.getElementById('sendBtn');
      const payload = 'hello2333999w rudhra';
      btn.disabled = true;
      btn.textContent = 'Sending...';
      
      addSuperLog('INFO', `INSERT request initiated -> content: "${payload}"`);
      const startTime = performance.now();

      const { error } = await client
        .from('messages')
        .insert([{ content: payload }]);

      const latency = Math.round(performance.now() - startTime);
      btn.disabled = false;
      btn.textContent = '+ Send "hello2333999w rudhra"';

      if (error) {
        addSuperLog('ERROR', `INSERT failed (${latency}ms): ${error.message}`);
        showToast('Error: ' + error.message, true);
      } else {
        addSuperLog('SUCCESS', `INSERT committed in ${latency}ms.`);
        showToast('Message added to database');
        readMessages();
      }
    }

    // 2. Read messages
    async function readMessages() {
      const tbody = document.getElementById('tableBody');
      addSuperLog('INFO', 'SELECT * FROM messages ORDER BY id DESC...');
      const startTime = performance.now();

      const { data, error } = await client
        .from('messages')
        .select('*')
        .order('id', { ascending: false });

      const latency = Math.round(performance.now() - startTime);

      if (error) {
        addSuperLog('ERROR', `SELECT failed (${latency}ms): ${error.message}`);
        tbody.innerHTML = `<tr><td colspan="4" class="empty-state" style="color:#dc2626;">Error: ${error.message}</td></tr>`;
        return;
      }

      allMessages = data || [];
      addSuperLog('SUCCESS', `Fetched ${allMessages.length} records in ${latency}ms.`);
      renderTable();
    }

    // Search & Filter Handling
    function handleSearch() {
      const query = document.getElementById('searchInput').value;
      const clearBtn = document.getElementById('clearSearchBtn');
      clearBtn.style.display = query.length > 0 ? 'block' : 'none';
      renderTable();
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').style.display = 'none';
      addSuperLog('INFO', 'Search filter cleared.');
      renderTable();
    }

    // Render Table with Search Highlighting
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      const countBadge = document.getElementById('recordCount');
      const filterStatus = document.getElementById('filterStatus');
      const rawQuery = document.getElementById('searchInput').value.trim();
      const query = rawQuery.toLowerCase();

      const filtered = allMessages.filter(m => {
        if (!query) return true;
        const idMatch = String(m.id).includes(query);
        const contentMatch = (m.content || '').toLowerCase().includes(query);
        const dateStr = m.created_at 
          ? new Date(m.created_at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }).toLowerCase() 
          : '';
        const dateMatch = dateStr.includes(query);
        return idMatch || contentMatch || dateMatch;
      });

      countBadge.textContent = `${allMessages.length} ${allMessages.length === 1 ? 'record' : 'records'}`;
      filterStatus.textContent = query 
        ? `Found ${filtered.length} matching "${rawQuery}"` 
        : `Showing all ${allMessages.length} records`;

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="empty-state">
              ${query ? `No records match "<strong>${escapeHTML(rawQuery)}</strong>".` : 'No messages found in the database.'}
            </td>
          </tr>`;
        return;
      }

      tbody.innerHTML = filtered.map(m => {
        const formattedDate = m.created_at 
          ? new Date(m.created_at).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) 
          : '—';

        const safeContent = highlightMatch(escapeHTML(m.content), rawQuery);
        const safeId = highlightMatch(`#${m.id}`, rawQuery);
        const safeDate = highlightMatch(formattedDate, rawQuery);

        return `
          <tr id="row-${m.id}">
            <td class="id-col">${safeId}</td>
            <td>${safeContent}</td>
            <td class="time-col">${safeDate}</td>
            <td class="action-col">
              <button class="btn-delete" onclick="deleteMessage(${m.id}, this)">Delete</button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // 3. Delete message effectively with loading state & confirmation
    async function deleteMessage(id, btnElement) {
      if (!confirm(`Are you sure you want to delete message #${id}?`)) {
        addSuperLog('WARN', `DELETE aborted by user for record #${id}.`);
        return;
      }

      btnElement.disabled = true;
      btnElement.textContent = 'Deleting...';
      const row = document.getElementById(`row-${id}`);
      if (row) row.style.opacity = '0.5';

      addSuperLog('WARN', `DELETE request initiated for record #${id}...`);
      const startTime = performance.now();

      const { error } = await client
        .from('messages')
        .delete()
        .eq('id', id);

      const latency = Math.round(performance.now() - startTime);

      if (error) {
        addSuperLog('ERROR', `DELETE failed for #${id} (${latency}ms): ${error.message}`);
        showToast('Delete failed: ' + error.message, true);
        btnElement.disabled = false;
        btnElement.textContent = 'Delete';
        if (row) row.style.opacity = '1';
      } else {
        addSuperLog('SUCCESS', `Record #${id} permanently deleted in ${latency}ms.`);
        showToast(`Deleted record #${id}`);
        readMessages();
      }
    }

    // Highlight matching search text safely
    function highlightMatch(text, query) {
      if (!query) return text;
      const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escapedQuery})`, 'gi');
      return text.replace(regex, '<mark>$1</mark>');
    }

    // Prevent XSS when rendering database strings
    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
<script>
    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
        if (
            e.key === "F12" ||
            (e.ctrlKey && e.shiftKey &&
            ["I", "J", "C"].includes(e.key.toUpperCase())) ||
            (e.ctrlKey && e.key.toUpperCase() === "U")
        ) {
            e.preventDefault();
        }
    });
    </script>
<script src="database_script.js"></script>
</body>
